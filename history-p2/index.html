<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Explorer Dash</title>
<style>
:root{
  --purple:#6c4ce0; --purple-d:#54389f; --teal:#12b5a5; --teal-d:#0d8c80;
  --bg:#f4f2fc; --card:#ffffff; --ink:#2b2350; --sub:#6f6a8a;
  --good:#1fa552; --bad:#e0485a; --warn:#f2a51a; --line:#e6e2f5;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,'SF Pro Rounded',BlinkMacSystemFont,'Segoe UI',sans-serif;
  height:100%; overscroll-behavior:none;}
#app{max-width:820px;margin:0 auto;padding:14px 16px 40px;min-height:100%;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px;}
.brand{font-weight:800;font-size:20px;color:var(--purple);letter-spacing:.3px;}
.brand span{color:var(--teal);}
.streak{font-weight:700;color:var(--warn);font-size:16px;}
.pbar{height:12px;background:#e4dff7;border-radius:8px;overflow:hidden;margin:2px 0 16px;}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--purple));border-radius:8px;transition:width .4s;}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 3px 14px rgba(80,60,160,.08);margin-bottom:16px;}
.study{border:2px solid var(--purple);border-radius:16px;padding:14px 16px;background:#faf9ff;margin:12px 0;}
.study h4{margin:0 0 8px;color:var(--purple);font-size:15px;}
h1{font-size:26px;margin:8px 0 6px;} h2{font-size:21px;margin:4px 0 10px;}
p{line-height:1.5;} .sub{color:var(--sub);font-size:15px;}
.big{font-size:22px;line-height:1.6;}
.qtext{font-size:22px;line-height:1.7;margin:6px 0 14px;}
.qtext u{text-decoration-color:var(--teal);text-decoration-thickness:3px;}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:16px;font-size:19px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:12px;min-height:58px;}
.btn:active{transform:scale(.985);}
.btn-main{background:var(--purple);color:#fff;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-soft{background:#ece8fb;color:var(--purple-d);}
.btn-ghost{background:none;color:var(--sub);font-weight:600;font-size:16px;min-height:44px;padding:10px;}
.btn:disabled{opacity:.45;}
.choices{display:flex;flex-direction:column;gap:10px;margin:10px 0;}
.choices.row{flex-direction:row;} .choices.row .choice{flex:1;text-align:center;font-size:26px;}
.choice{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:20px;
  font-weight:600;font-family:inherit;cursor:pointer;color:var(--ink);}
.choice.sel{border-color:var(--purple);background:#f1edff;}
.answer-row{display:flex;align-items:center;gap:10px;margin:8px 0;}
.answer-row label{font-size:18px;font-weight:700;}
input.ans{flex:1;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:24px;font-family:inherit;
  min-width:120px;background:#fff;color:var(--ink);}
input.ans:focus{outline:none;border-color:var(--teal);}
.canvas-wrap{border:2px dashed #cfc8ee;border-radius:16px;background:#fff;position:relative;margin:12px 0 4px;}
.canvas-label{position:absolute;top:8px;left:12px;color:#b9b2d8;font-size:14px;font-weight:600;pointer-events:none;}
canvas.work{width:100%;height:240px;border-radius:14px;touch-action:none;display:block;}
.tools{display:flex;gap:8px;margin:6px 0 2px;}
.tool{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;
  font-size:15px;font-weight:700;font-family:inherit;color:var(--sub);cursor:pointer;}
.tool.on{border-color:var(--teal);color:var(--teal-d);background:#eafaf8;}
.feedback{border-radius:16px;padding:14px 16px;margin-top:12px;font-size:18px;line-height:1.5;}
.fb-good{background:#e6f7ec;border:2px solid var(--good);}
.fb-bad{background:#fdeef0;border:2px solid var(--bad);}
.fb-hint{background:#fff8e8;border:2px solid var(--warn);}
.sol{background:#f1edff;border:2px solid var(--purple);border-radius:16px;padding:14px 16px;margin-top:12px;font-size:18px;line-height:1.7;}
.mastery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.skill-tile{background:#fff;border-radius:14px;padding:12px;border:2px solid var(--line);}
.skill-tile b{font-size:14px;display:block;margin-bottom:6px;}
.meter{height:10px;background:#eee9fb;border-radius:6px;overflow:hidden;}
.meter>div{height:100%;border-radius:6px;transition:width .5s;}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
.badge{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:700;}
.badge.won{border-color:var(--warn);background:#fff8e8;}
.center{text-align:center;}
.emoji-big{font-size:56px;margin:10px 0;}
.timer{font-size:30px;font-weight:800;color:var(--purple);text-align:center;letter-spacing:1px;}
.timer.low{color:var(--bad);}
table.dash{width:100%;border-collapse:collapse;font-size:15px;}
table.dash th,table.dash td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
.pill{display:inline-block;border-radius:10px;padding:2px 10px;font-size:13px;font-weight:700;color:#fff;}
.pill.g{background:var(--good);} .pill.b{background:var(--bad);} .pill.w{background:var(--warn);}
img.hw{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;}
textarea.note{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:16px;min-height:60px;}
.small{font-size:14px;color:var(--sub);}
.rowflex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
svg.nline{width:100%;height:auto;margin:8px 0;}
.hidden{display:none;}
a.linkbtn{display:block;text-align:center;text-decoration:none;}
</style>
</head>

const app=document.getElementById('app');

const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* ============ skills (Paper 2) ============ */
const SKILLS={
 s1:{name:'Mapungubwe: Origins & Geography',emoji:'🏔️',color:'#b45309',essential:true},
 s2:{name:'Mapungubwe: Society & Gold',emoji:'🦏',color:'#d97706',essential:true},
 s3:{name:'Trade & the Indian Ocean',emoji:'🐘',color:'#0e7490',essential:true},
 s4:{name:'Great Zimbabwe',emoji:'🪨',color:'#15803d',essential:true},
 s5:{name:'Marco Polo',emoji:'🧭',color:'#7c3aed',essential:false},
 s6:{name:'Renaissance & Exploration',emoji:'🎨',color:'#be123c',essential:true},
 s7:{name:'New Ideas & Inventions',emoji:'⚙️',color:'#4f46e5',essential:true},
 s8:{name:'Religion & the Reformation',emoji:'⛪',color:'#0891b2',essential:false},
 s9:{name:'da Vinci & Galileo',emoji:'🔭',color:'#9333ea',essential:true},
 s10:{name:'Explorers: Dias & da Gama',emoji:'⛵',color:'#2563eb',essential:true}
};
const LESSONS={
 s1:{title:'Mapungubwe: Origins & Geography',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>About <b>900 AD</b>, African farmers moved south from Zimbabwe and east from Botswana and settled in the <b>Limpopo Valley</b>. The population grew because of <b>better farming</b>, <b>iron-working technology</b> and the <b>growth of trade networks</b>.</p>
   <p><b>Mapungubwe</b> was the <b>first state in southern Africa</b> (about 1200–1300), in the <b>BuKalanga Kingdom</b>, where the <b>Shashe</b> and <b>Limpopo</b> rivers meet (in Limpopo province). It was discovered by <b>Mr E.S.J. van Graan</b> and his son on <b>31 December 1932</b>. The name means <b>"hill of jackals"</b> (also "place of wisdom").</p>
   <p>It had rich soil for <b>millet, sorghum and cotton</b>, gold-bearing rock and herds of elephants (ivory). The site had three areas: <b>Mapungubwe hill</b> (top), the <b>Southern Terrace</b>, and <b>K2 / Bambanyanalo</b> (below the hill). Steep, narrow paths made it easy to defend.</p></div>`},
 s2:{title:'Mapungubwe: Society & Gold',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>Mapungubwe was the first society in southern Africa with a <b>social class system</b>. There were <b>three classes</b>: the <b>royal family</b> (top of the hill), the <b>leaders and advisors</b> (smaller hills), and the <b>commoners</b> (low-lying areas). The <b>king</b> lived at the top, close to the ancestors, and was a <b>sacred leader</b> (he could communicate with ancestors and make rain).</p>
   <p>Most people were <b>subsistence farmers</b> (they farmed just enough for their own needs) who also hunted. Rich people were buried in the hills with gold and copper. The famous <b>golden rhinoceros</b> (about <b>15 cm</b> long, gold beaten over a wooden core) is the symbol of Mapungubwe. Other gold objects: a <b>sceptre</b> (a sign of leadership) and gold <b>beads</b> and a gold <b>bowl</b>. The remains were <b>reburied</b> on <b>20 November 2007</b>.</p></div>`},
 s3:{title:'Trade & the Indian Ocean',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>Mapungubwe was rich in <b>gold</b> and <b>ivory</b>, so it became an important <b>trade hub</b>. It traded with Great Zimbabwe and with traders from the <b>Arabian Peninsula</b> and the Far East (Saudi Arabia, Iran, Pakistan, India and China).</p>
   <p>Mapungubwe <b>exported</b>: ivory, gold, animal hides and gold-tanned leather. It <b>imported</b> from the East: <b>spices, fine pottery, cloth and glass beads</b>. Groups carried gold and ivory over <b>500 km</b> to the coast, hiding gold inside tortoise shells and travelling at <b>night</b>, using the <b>stars</b> to navigate.</p>
   <p>Some Arab traders settled on the east coast and married local people. A new language, <b>Swahili</b> (a mix of African and Arab languages), developed. Through trade Mapungubwe connected to the world … the beginning of <b>globalisation</b>.</p></div>`},
 s4:{title:'Great Zimbabwe',html:
  `<div class="study"><h4>📖 Study</h4>
   <p><b>Great Zimbabwe</b> was a great African civilisation from medieval times, the centre of the <b>Kingdom of Mutapa</b>, and today a <b>UNESCO World Heritage site</b>. The name comes from the Shona word <b>"imbabwe" = "stone house"</b>. Up to <b>20 000</b> people lived there.</p>
   <p>It has <b>three sections</b>: the <b>Hill Complex</b> (the oldest, first stones about AD 900), the <b>Valley Ruins</b> (clay and mud brick houses), and the <b>Great Enclosure</b> (outer wall 250 m around, about 900 000 stone blocks, where the royal family lived).</p>
   <p>The people were ancestors of the <b>Shona</b>. They grew sorghum, millet and cow peas, and kept cattle. They traded with <b>China and the Arab world</b> (Indian beads, Chinese porcelain, Arab glassware were found). It ended (possibly from over-grazing); people moved north to the <b>Mutapa State</b> or south to the <b>Torwa State</b>. Only <b>2%</b> has been excavated.</p></div>`},
 s5:{title:'Marco Polo',html:
  `<div class="study"><h4>📖 Study</h4>
   <p><b>Marco Polo</b> was one of the most well-travelled men of the <b>13th century</b>, born in <b>Venice, Italy, in 1254</b>, into a wealthy family of merchant travellers. His father was <b>Niccolò</b> and his uncle <b>Maffeo</b>. He set off at about <b>17</b>.</p>
   <p>The Polos travelled through Armenia, Persia and Afghanistan to <b>China</b>, even crossing the <b>Gobi Desert</b>. They met <b>Kublai Khan</b>, emperor of the <b>Mongol empire</b>. Marco worked for him for <b>17 years</b> as a governor and tax inspector.</p>
   <p>Back in Venice he was captured in a war against <b>Genoa</b>. In prison a cell-mate wrote down his stories in <b>"The Travels of Marco Polo"</b>. He described <b>gunpowder, paper money and the magnetic compass</b>. Many thought he was lying and called the book <i>Il Milione</i> ("the million lies").</p></div>`},
 s6:{title:'Renaissance & Reasons for Exploration',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>The <b>Renaissance</b> means <b>"rebirth"</b>. It was the period in Europe right after the Middle Ages that <b>began in Italy</b> (about the 12th–14th century), with new interest in learning, art and science. New inventions included paper, gunpowder and the magnetic compass.</p>
   <p><b>Reasons for European exploration:</b> to find <b>spices, silk, gold</b>, medicines and precious stones; to find <b>sea routes and trading partners</b>; to <b>expand knowledge and empire</b>; and to <b>spread religion</b>.</p>
   <p>The <b>spice trade</b> was the world's biggest industry. The <b>Silk Road</b> connected Asia to Europe overland. <b>Venice</b> controlled the spice trade and charged very high prices, so Europeans had to find a <b>new sea route</b> to the East. Popular spices: <b>pepper, cinnamon, nutmeg, ginger and cloves</b> (pepper preserved meat).</p></div>`},
 s7:{title:'New Ideas & Inventions',html:
  `<div class="study"><h4>📖 Study</h4>
   <p><b>Gunpowder</b> was the first chemical explosive, one of the "Four Great Inventions" of <b>China</b>. It reached Europe along the <b>Silk Road</b>.</p>
   <p>The <b>magnetic compass</b> (from China, 12th century) showed sailors which <b>direction</b> they were travelling.</p>
   <p>The <b>printing press</b>: <b>Johannes Gutenberg</b> printed the <b>Gutenberg Bible in 1452</b>. It made books cheap and available, starting an "information revolution" (like the Internet today) … and let people read the Bible themselves.</p>
   <p>The <b>caravel</b> was a small, easily-steered <b>Portuguese</b> sailing ship (15th century) with <b>lateen sails</b> that could sail into the wind, used to explore the West African coast.</p></div>`},
 s8:{title:'Religion & the Reformation',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>The printing press let new ideas and the <b>Bible</b> spread. The <b>Roman Catholic Church</b> had been the only church in Western Europe, but it began to <b>decline</b>.</p>
   <p><b>Martin Luther</b> sparked the <b>Reformation</b> in <b>1517</b> by nailing his <b>95 Theses</b> to the door of the Castle Church in <b>Wittenberg, Germany</b>. He was angry about the selling of <b>indulgences</b>. His followers broke away and became known as <b>Protestants</b>.</p>
   <p>The Reformation split Europe into <b>Protestant</b> and <b>Roman Catholic</b> countries, which often went to war with each other.</p></div>`},
 s9:{title:'Leonardo da Vinci & Galileo Galilei',html:
  `<div class="study"><h4>📖 Study</h4>
   <p><b>Leonardo da Vinci</b> (<b>1452–1519</b>) was born near Vinci in Northern Italy. At 14 he became an <b>apprentice</b> to the sculptor <b>Verrocchio</b>. He studied anatomy and invented a flying machine, the <b>Ornithopter</b>. He painted the <b>Mona Lisa</b> (also called <i>La Gioconda</i>) and wrote his notebooks in <b>mirror writing</b> (backwards). After his death it went to the King of France.</p>
   <p><b>Galileo Galilei</b> (<b>1564–1642</b>) was an Italian <b>astronomer</b>. He built a <b>telescope</b> and supported the <b>Copernican theory</b> (the Earth and planets go around the <b>Sun</b>). He saw that the <b>Milky Way</b> is made of stars, and found <b>moons around Jupiter</b>. The Church accused him of <b>heresy</b> twice.</p></div>`},
 s10:{title:'Explorers: Dias & da Gama',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>Portugal and Spain led the <b>Age of Exploration</b>. The <b>Treaty of Tordesillas</b> divided up the New World: Spain got most of the Americas, Portugal got Brazil, India and Asia.</p>
   <p><b>Bartolomeu Dias</b> was the <b>first European to sail around the Cape of Good Hope</b>. King John II sent him; in <b>1487–1488</b> he rounded the Cape, reached <b>Mossel Bay</b> (3 Feb 1488, meeting the Khoikhoi), and turned back at Kwaaihoek where he put up a <b>padrão</b> (stone cross).</p>
   <p><b>Vasco da Gama</b> (1460–1524) found the <b>sea route to India</b>. He sailed from Lisbon in <b>1497</b> (patron King Manuel I), rounded the Cape, and reached <b>Calicut, India, on 20 May 1498</b>. Many crew died of <b>scurvy</b> (lack of Vitamin C). He returned in 1499 a hero, later became <b>viceroy</b>, and died in India in <b>1524</b>.</p></div>`}
};

<script>
"use strict";
/* ===== Explorer Dash · History content ===== */
let SEQ=0; function newId(t){const r=(self.crypto&&crypto.randomUUID)?crypto.randomUUID().slice(0,8):(Date.now().toString(36)+Math.random().toString(36).slice(2,6));return t+"-"+(++SEQ)+"-"+r;}
function mc(marks,diff,prompt,correct,wrong,sol,hint){return {input:'choice',marks,diff,prompt,choices:shuffle([correct].concat(wrong)),ans:correct,sol,hints:[hint]};}
function fl(marks,diff,prompt,ans,alt,sol,hint,ph){return {input:'text',marks,diff,prompt,ans,alt:alt||[],sol,hints:[hint],placeholder:ph||'write here ✏️'};}
function tf(marks,diff,statement,isTrue,sol,hint){return {input:'choice',marks,diff,prompt:'<b>True</b> or <b>false?</b><br>'+statement,choices:['True','False'],ans:isTrue?'True':'False',sol,hints:[hint]};}
function wr(marks,diff,prompt,model,rubric,hint){return {input:'draw',marks,diff,prompt,ans:'(written)',model,sol:rubric,hints:[hint]};}
const TYPES={}; const SKILL_TYPES={};
function reg(id,skill,draw,pool){ TYPES[id]={draw:!!draw,count:pool.length,gen:fx=>{
  const raw=(fx&&fx.i!=null)?Number(fx.i):ri(0,pool.length-1);
  const i=((Math.trunc(raw)%pool.length)+pool.length)%pool.length;
  const it=pool[i](); it.skill=skill; it.qid=id+':'+i; return it;
}}; (SKILL_TYPES[skill]=SKILL_TYPES[skill]||[]).push(id); }

/* ---------- s1 Mapungubwe origins & geography ---------- */
reg('s1q','s1',false,[
 ()=>mc(1,1,'Who discovered Mapungubwe?','Mr van Graan and his son',['Marco Polo','Vasco da Gama','King Manuel I'],'Mr E.S.J. van Graan and his son climbed the hill on 31 December 1932.','Think of the man who climbed the sandstone hill in 1932.'),
 ()=>mc(1,2,'On what date was Mapungubwe discovered?','31 December 1932',['20 November 2007','1 December 1932','31 December 1923'],'Van Graan climbed the hill on 31 December 1932.','It was the very last day of a year in the 1930s.'),
 ()=>fl(1,2,'What does the name "Mapungubwe" mean? (two words)','hill of jackals',['place of jackals','hill of the jackals'],'It is thought to mean "hill of jackals" (also "place of wisdom").','It is a hill where a certain wild dog-like animal eats.'),
 ()=>mc(2,2,'Which two rivers meet at Mapungubwe?','The Shashe and Limpopo',['The Nile and Limpopo','The Zambezi and Shashe','The Vaal and Orange'],'Mapungubwe is where the Shashe and Limpopo rivers meet.','One of them also gives its name to the province.'),
 ()=>mc(2,2,'Which three crops were grown at Mapungubwe?','Millet, sorghum and cotton',['Wheat, maize and rice','Millet, maize and tea','Sorghum, sugar and coffee'],'The rich soil grew millet, sorghum and cotton.','One is used to make cloth, the other two are grains.'),
 ()=>mc(1,1,'Mapungubwe was the first what in southern Africa?','The first state',['The first city in the world','The first Portuguese colony','The first church'],'Mapungubwe was the first state in southern Africa (about 1200–1300).','It was a whole organised kingdom, the first of its kind here.'),
 ()=>mc(2,3,'What were the three areas of Mapungubwe?','Mapungubwe hill, the Southern Terrace and K2',['Hill Complex, Valley Ruins and Great Enclosure','North, South and Central','Venice, Genoa and Calicut'],'The site had Mapungubwe hill (top), the Southern Terrace, and K2 / Bambanyanalo.','Do not mix these up with the three sections of Great Zimbabwe.'),
 ()=>fl(1,2,'In about which year did African farmers first settle in the Limpopo Valley?','900',['900 AD','AD 900'],'About 900 AD, farmers moved south and settled in the Limpopo Valley.','It is a round number, about 300 years before Mapungubwe was a state.'),
 ()=>tf(1,2,'Mapungubwe was easy for enemies to attack.',false,'False. Steep, narrow paths made it easy to spot and stop invaders, so it was well protected.','Remember the steep, narrow paths up the hill.'),

]);
reg('s1w','s1',true,[

/* ---------- s2 Mapungubwe society & gold ---------- */
reg('s2q','s2',false,[
 ()=>mc(1,1,'How many social classes were there at Mapungubwe?','Three',['Two','Four','Five'],'There were three classes: the royal family, the leaders/advisors, and the commoners.','Royals, leaders, and ordinary people.'),
 ()=>mc(1,2,'Who lived at the top of Mapungubwe hill?','The royal family (the king)',['The commoners','The traders','The Portuguese'],'The king and royal family lived at the top, close to the ancestors.','The most important people lived highest up.'),
 ()=>mc(2,2,'About how long is the famous golden rhinoceros?','About 15 cm',['About 15 metres','About 1 metre','About 50 cm'],'The golden rhino is only about 15 cm long, gold beaten over a wooden core.','It is small enough to hold in your hands.'),
 ()=>fl(1,2,'Which golden animal is the symbol of Mapungubwe?','golden rhinoceros',['rhinoceros','golden rhino','gold rhino','rhino'],'The golden rhinoceros is the best-known Mapungubwe gold object.','It is a large horned animal, made of gold.'),

/* ---------- builders ---------- */
function makeItem(typeid,fx){ const it=TYPES[typeid].gen(fx||null); it.type=typeid; it.id=newId(typeid); return it; }
function legacyQuestionKey(it){ return String(it&&it.type||'')+'|'+String(it&&it.prompt||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim(); }
function rememberQuestion(used,it){ if(it&&it.qid)used.add(it.qid); if(it&&it.type&&it.prompt)used.add(legacyQuestionKey(it)); return used; }
function questionUsed(used,it){ return !!(it&&(used.has(it.qid)||used.has(legacyQuestionKey(it)))); }
function questionHistory(extra){
  const used=new Set(); const history=(typeof S!=='undefined'&&S&&Array.isArray(S.log))?S.log:[];
  history.concat(extra||[]).forEach(it=>rememberQuestion(used,it)); return used;
}
function makeFromRefs(refs,used,avoidQid){
  const order=shuffle(refs), history=used||questionHistory(); let fallback=null;
  for(const ref of order){ const it=makeItem(ref.type,{i:ref.i});
    if(!fallback&&it.qid!==avoidQid)fallback=it;
    if(it.qid!==avoidQid&&!questionUsed(history,it)){rememberQuestion(history,it);return it;}
  }
  const it=fallback||makeItem(order[0].type,{i:order[0].i}); rememberQuestion(history,it); return it;
}
function makeFromSkill(skill,allowDraw,used){
  let ts=SKILL_TYPES[skill].slice();
  if(!allowDraw) ts=ts.filter(t=>!TYPES[t].draw);
  if(!ts.length) ts=SKILL_TYPES[skill];
  const refs=[]; ts.forEach(type=>{for(let i=0;i<TYPES[type].count;i++)refs.push({type,i});});
  return makeFromRefs(refs,used||questionHistory());
}
function makeSimilarItem(req,used){
  const type=req&&req.type; if(!TYPES[type])return null;
  const refs=[]; for(let i=0;i<TYPES[type].count;i++)refs.push({type,i});
  return makeFromRefs(refs,used||questionHistory(),req.qid||null);
}
function replayItem(attempt){
  const m=String(attempt&&attempt.qid||'').match(/^([a-z0-9]+):(\d+)$/i);
  return makeItem(attempt.type,m&&m[1]===attempt.type?{i:Number(m[2])}:null);
}

function cleanName(s){ return String(s||'').trim().replace(/[\s\-−–—]+$/,''); }
function hydrateState(saved){
  const base=JSON.parse(JSON.stringify(DEFAULT));
  if(saved&&typeof saved==='object'){
    for(const k in base){ const dv=base[k], sv=saved[k]; if(sv===undefined) continue;
      if(Array.isArray(dv)){ if(Array.isArray(sv)){ const out=dv.slice(); for(let i=0;i<sv.length;i++) out[i]=sv[i]; base[k]=out; } }
      else if(dv&&typeof dv==='object'){ base[k]=Object.assign({},dv,(sv&&typeof sv==='object')?sv:{}); }
      else base[k]=sv; }
    if(base.mastery&&DEFAULT.mastery){ for(const sk in DEFAULT.mastery){ let v=Number(base.mastery[sk]); if(!isFinite(v)) v=DEFAULT.mastery[sk]; base.mastery[sk]=Math.max(0,Math.min(100,v)); } }
  }
  if(!base.progressBase||typeof base.progressBase!=='object'||!base.progressBase.mastery){
    base.progressBase={mastery:Object.assign({},base.mastery),stars:Number(base.stars)||0,streak:Number(base.streak)||0,best:Number(base.best)||0};
  }
  base.name=cleanName(base.name); base.schemaVersion=SCHEMA; return base;
}
function load(){ try{ const j=localStorage.getItem('histp2'); if(j){ const o=hydrateState(JSON.parse(j)); return o; } }catch(e){}
  return hydrateState(null); }

/* ============ adaptive ============ */
function weakOrder(){ return Object.keys(SKILLS).sort((a,b)=>
  (S.mastery[a]-(SKILLS[a].essential?15:0))-(S.mastery[b]-(SKILLS[b].essential?15:0))); }
function pickPracticeItems(n){
  const w=weakOrder(); const pool=[w[0],w[0],w[1],w[1],w[2],w[3]];
  const used=questionHistory(),items=[]; for(let i=0;i<n;i++) items.push(makeFromSkill(pool[i%pool.length],false,used));
  return shuffle(items); }
function masteredSkills(){ return Object.keys(SKILLS).filter(s=>S.mastery[s]>=70); }
function confidenceItems(n){
  const ms=masteredSkills(); const src=ms.length?ms:weakOrder().slice(-3);
  const used=questionHistory(),items=[];for(let i=0;i<n;i++)items.push(makeFromSkill(pick(src),false,used));
  return items; }
function masteryDelta(firstTry,correct,hints){return correct&&firstTry&&!hints?14:correct&&firstTry?8:correct?5:-12;}
function updateMastery(skill,firstTry,correct,hints){S.mastery[skill]=Math.max(0,Math.min(100,S.mastery[skill]+masteryDelta(firstTry,correct,hints)));}
function replayProgressEffects(){
  const b=S.progressBase,mastery=Object.assign({},b.mastery);let stars=Math.max(0,Number(b.stars)||0),streak=Math.max(0,Number(b.streak)||0),best=Math.max(streak,Number(b.best)||0);
  S.log.map((attempt,index)=>({attempt,index})).filter(x=>x.attempt&&x.attempt.progressEffect).sort((a,b)=>{
    const at=Number(a.attempt.ts),bt=Number(b.attempt.ts),av=Number.isFinite(at)?at:a.index,bv=Number.isFinite(bt)?bt:b.index;return av-bv||a.index-b.index;
  }).forEach(({attempt})=>{const e=attempt.progressEffect,d=Number(e.masteryDelta);
    if(attempt.skill&&Number.isFinite(d)&&Number.isFinite(Number(mastery[attempt.skill])))mastery[attempt.skill]=Math.max(0,Math.min(100,Number(mastery[attempt.skill])+d));
    if(Number.isFinite(Number(e.stars)))stars=Math.max(0,stars+Number(e.stars));
    if(e.streak==='increment'){streak++;best=Math.max(best,streak);}else if(e.streak==='reset')streak=0;
  });S.mastery=mastery;S.stars=stars;S.streak=streak;S.best=best;
}
function answerProgressEffect(firstTry,correct,hints,mode){const reward=mode!=='diag'&&mode!=='mock',full=reward&&correct&&firstTry&&!hints;

/* ============ answer checking ============ */
function checkAnswer(item,user){
  if(item.input==='choice'||item.input==='compare') return user===item.ans;
  let u=String(user||'').trim(); if(!u) return false;
  const norm=x=>String(x).toLowerCase().replace(/[.,;:!?'"()’]/g,'').replace(/\s+/g,' ').replace(/^(the|a|an) /,'').trim();
  const list=[item.ans].concat(item.alt||[]);
  const un=norm(u);
  return list.some(a=>norm(a)===un);
}

function curItem(){ return S.cur.items[S.qi]; }

function tickClock(){ clearTimeout(clockTimer);

// F-03: automated Pencil grading (no learner self-marking). History prose gets a

function pencilRubric(it){

function recordPendingPencilAttempt(it,png){

async function gradePencilAnswer(it){

function qToken(){ return S.cur?(S.session+":"+S.qi+":"+S.cur.mode):null; }

function doCheck(){ if(qLock) return;

  if(user==null||String(user).trim()===''){ showFB('hint','✏️ Write your answer first … you can do it!'); return; }

  if(mode==='diag'||mode==='mock'){ qLock=true; recordAttempt(it,user,ok,true);

    disableCheck(); scheduleAdvance(700); return; }

      $('#fb').insertAdjacentHTML('beforeend',`<div class="sol"><b>💡 How it works:</b><br>${it.sol}</div>

function recordAttempt(it,user,correct,firstTry){

<script>
"use strict";
/* ============ Apple Pencil canvas ============ */
let cv=null,cctx=null,strokes=[],curStroke=null,tool='pen';
function initCanvas(){
  cv=$('#cv'); if(!cv) return;
  const w=cv.clientWidth||700,h=cv.clientHeight||240,dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=w*dpr; cv.height=h*dpr;
  cctx=cv.getContext('2d'); cctx.scale(dpr,dpr);
  cv._w=w; cv._h=h; strokes=[]; tool='pen'; redraw();
  cv.addEventListener('pointerdown',penDown,{passive:false});
  cv.addEventListener('pointermove',penMove,{passive:false});
  cv.addEventListener('pointerup',penUp); cv.addEventListener('pointercancel',penUp);
}
function pos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function penDown(e){ e.preventDefault(); cv.setPointerCapture(e.pointerId);
  curStroke={tool,pts:[pos(e)],w:tool==='pen'?(e.pointerType==='pen'?2.2:2.6):22}; strokes.push(curStroke); redraw(); }
function penMove(e){ if(!curStroke) return; e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of evs) curStroke.pts.push(pos(ev)); redraw(); }
function penUp(){ curStroke=null; }
function setTool(t){ tool=t; $('#penB').classList.toggle('on',t==='pen'); $('#erB').classList.toggle('on',t==='eraser'); }
function undoStroke(){ strokes.pop(); redraw(); }
function clearCanvas(){ strokes=[]; redraw(); }
function redraw(){ if(!cctx) return;
  cctx.fillStyle='#fff'; cctx.fillRect(0,0,cv._w,cv._h);
  cctx.strokeStyle='#eef0f6'; cctx.lineWidth=1;
  for(let y=30;y<cv._h;y+=30){cctx.beginPath();cctx.moveTo(0,y);cctx.lineTo(cv._w,y);cctx.stroke();}
  for(const s of strokes){ cctx.strokeStyle=s.tool==='pen'?'#1c2440':'#ffffff';
    cctx.lineWidth=s.w; cctx.lineCap='round'; cctx.lineJoin='round';
    cctx.beginPath(); const p=s.pts; cctx.moveTo(p[0][0],p[0][1]);
    for(let i=1;i<p.length;i++)cctx.lineTo(p[i][0],p[i][1]); cctx.stroke(); }
}
function canvasDirty(){ return strokes.some(s=>s.tool==='pen'); }
function exportCanvas(){
  const W=620,sx=W/(cv._w||W),H=Math.ceil((cv._h||240)*sx);
  const off=document.createElement('canvas'); off.width=W; off.height=H;
  const c=off.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,W,H);

    c.lineWidth=s.w*sx; c.lineCap='round'; c.lineJoin='round';
    c.beginPath(); const p=s.pts; c.moveTo(p[0][0]*sx,p[0][1]*sx);
    for(let i=1;i<p.length;i++)c.lineTo(p[i][0]*sx,p[i][1]*sx); c.stroke(); }
  return off.toDataURL('image/jpeg',0.55);
}

    const at=S.log.slice(-120).reverse();
    body=`<h2>Every question</h2><p class="small">Tap a row to review handwriting, override the mark, comment, or assign a similar question. ✎ = handwriting captured.</p>
     <table class="dash"><tr><th>S·Mode</th><th>Skill</th><th>Her answer</th><th>Mark</th></tr>
     ${at.map((a,i)=>{const ov=S.overrides[a.id];const ok=ov!=null?ov:a.correct;const mark=ok===null?'waiting for review':(ok?'✓':'✗');
       return `<tr onclick="renderPDetail(${S.log.indexOf(a)})" style="cursor:pointer">
        <td>${a.session+1}·${a.mode}</td><td>${SKILLS[a.skill].emoji} ${a.type}${a.png?' ✎':''}</td>
        <td>${esc(String(a.user).slice(0,14))}</td>
        <td><span class="pill ${ok===null?'w':ok?'g':'b'}">${mark}${ov!=null?' *':''}</span></td></tr>`;}).join('')}</table>
     <p class="small">* = overridden by you</p>
     <h3>Assign extra practice</h3><p class="small">Send her a code by iMessage. She taps "🎁 code from Dad" and types it in.</p>
     <div class="rowflex">${Object.keys(SKILLS).map(s=>
       `<button class="tool" onclick="makeCode('${s}')">${SKILLS[s].emoji} ${SKILLS[s].name}</button>`).join('')}</div>
     <div id="codeOut"></div>`;
  }
  else if(tab==='io'){
    body=`<h2>Import / Export</h2>
     <p class="small"><b>Import</b> a session file from the iCloud folder (when reviewing on your own iPad):</p>
     <input type="file" id="impF" accept=".json">
     <button class="btn btn-soft" onclick="importFile()">Import session file</button>
     <p class="small" style="margin-top:14px"><b>Export</b> everything (full backup, also useful to send to Claude):</p>
     <button class="btn btn-soft" onclick="exportAll()">Download full backup</button>
     <div id="ioMsg"></div>`;
  }
  else{
    body=`<h2>Settings</h2>
     <p class="small">Learner name</p><input class="ans" id="setName" value="${esc(S.name)}">
     <button class="btn btn-soft" onclick="const n=cleanName($('#setName').value);if(n)S.name=n;save();alert('Saved.')">Save</button>
       <button class="btn btn-ghost" onclick="if(confirm('Reset EVERYTHING? All progress will be lost.')){localStorage.removeItem('histp2');location.reload();}">⚠️ Reset the whole app</button>`;
  }
  render(`${header(0)}<div class="card">${pTabs(tab)}${body}</div>`);
}
function queueSimilar(i){
  const a=S.log[i]; if(!a||!TYPES[a.type])return;
  S.retryQueue.push({type:a.type,qid:a.qid||null,reason:'parent'}); save();
  alert('A similar question was added to her next Fix-it round.');
}
function renderPDetail(i){
  if(!parentIdentity().isParent){renderParentGate();return;}
  const a=S.log[i]; if(!a){renderParent('q');return;}
  const ov=S.overrides[a.id]; const ok=ov!=null?ov:a.correct;
  const pending=a.pencil===true&&a.correct===null&&a.needsParentReview===true;
  const status=pending?'waiting for review':(ok?'correct':'incorrect');
  const controls=pending?`<div class="feedback fb-hint">This Pencil answer must be approved or corrected through the durable Parent Corner review.<a class="btn btn-main linkbtn" href="../hub/">Open review in Study Hub</a></div>`:`
   <div class="rowflex" style="margin-top:10px">
     <button class="tool" onclick="S.overrides['${a.id}']=true;save();renderPDetail(${i})">Override: correct ✓</button>
     <button class="tool" onclick="S.overrides['${a.id}']=false;save();renderPDetail(${i})">Override: incorrect ✗</button>
     <button class="tool" onclick="delete S.overrides['${a.id}'];save();renderPDetail(${i})">Clear override</button>
     <button class="tool" onclick="queueSimilar(${i})">Assign similar ↻</button></div>`;
  render(`${header(0)}<div class="card">${pTabs('q')}
   <h2>Question review</h2>
   <p class="small">Session ${a.session+1} · ${a.mode} · ${SKILLS[a.skill].name} · ${a.timeS}s · hints used: ${a.hints} · source: ${TYPES[a.type]?'':''}${esc(a.type)}</p>
   <div class="qtext" style="font-size:18px">${a.prompt}</div>
   <p><b>Her answer:</b> ${esc(a.user)} &nbsp; <b>Expected:</b> ${esc(String(a.ans))} &nbsp;
      <span class="pill ${pending?'w':ok?'g':'b'}">${status}${ov!=null?' (overridden)':''}</span></p>
   ${a.png?`<p class="small">Her handwritten working:</p><img class="hw" src="${a.png}">`:'<p class="small">No handwriting captured for this one.</p>'}
   ${controls}
   <p class="small" style="margin-top:10px">Comment (she'll see this if you review together; also included in exports):</p>
   <textarea class="note" id="cmt">${esc(S.comments[a.id]||'')}</textarea>
   <button class="btn btn-soft" onclick="S.comments['${a.id}']=$('#cmt').value;save();alert('Comment saved.')">Save comment</button>
  </div>`);
}
function makeCode(skill){
  const ts=shuffle(SKILL_TYPES[skill].slice()).slice(0,3);
  $('#codeOut').innerHTML=`<div class="feedback fb-good">Send her this code: <b>DD-${ts.join('.')}</b><br>
    <a class="btn btn-teal linkbtn" style="margin-top:8px" href="sms:&body=${encodeURIComponent('Here is a bonus round for you! 🎁 Open Explorer Dash, tap "code from Dad" and type: DD-'+ts.join('.'))}">Send by iMessage</a></div>`;
}
// Strict per-field import validation + in-package dedup (audit M-03/C-02).
const IMPORT_ID=/^[A-Za-z0-9._:-]{1,80}$/;
function normAttempt(raw){
  if(!raw||typeof raw!=='object')throw 0;
  if(!IMPORT_ID.test(String(raw.id)))throw 0;
  if(!TYPES[raw.type])throw 0;
  if(!SKILLS[raw.skill])throw 0;
  const c=raw.correct===true?true:(raw.correct===false?false:null);
  const q=String(raw.qid||''),qid=/^[a-z0-9]+:\d+$/i.test(q)&&q.startsWith(raw.type+':')?q:null;
  return {id:String(raw.id),qid,type:raw.type,skill:raw.skill,mode:String(raw.mode||'').slice(0,24),
    session:Number.isInteger(raw.session)?raw.session:0,
    user:String(raw.user==null?'':raw.user).slice(0,200),correct:c,
    marks:Number.isFinite(raw.marks)?raw.marks:0,maxMarks:Number.isFinite(raw.maxMarks)?raw.maxMarks:0,
    ts:Number.isFinite(raw.ts)?raw.ts:Date.now(),
    hints:Number.isFinite(raw.hints)?raw.hints:0,timeS:Number.isFinite(raw.timeS)?raw.timeS:0,
    ans:String(raw.ans==null?'':raw.ans).slice(0,200),
    prompt:esc(String(raw.promptText||raw.prompt||'').replace(/<[^>]*>/g,' ').slice(0,400)),
    pencil:raw.pencil===true,needsParentReview:raw.needsParentReview===true,imported:true};
}
function importFile(){
  const f=$('#impF').files[0]; if(!f){alert('Choose a file first.');return;}
  if(f.size>2000000){$('#ioMsg').innerHTML=`<div class="feedback fb-bad">That file is too large to import.</div>`;return;}
  const r=new FileReader();
  r.onload=()=>{ try{
    const p=JSON.parse(r.result);
    if(p&&p.kind==='full-backup'&&p.app==='ExplorerDashH2'&&p.state){
      if(!confirm('Restore a full backup? This replaces ALL current progress on this iPad.'))return;
      localStorage.setItem('histp2',JSON.stringify(p.state)); location.reload(); return;
    }
    if(!p||p.app!=='ExplorerDashH2'||!Array.isArray(p.attempts)||p.attempts.length>2000)throw 0;
    const seen=new Set(S.log.map(a=>a.id)); let n=0;
    for(const raw of p.attempts){ let a; try{a=normAttempt(raw);}catch(_){continue;} if(seen.has(a.id))continue; seen.add(a.id); S.log.push(a); n++; }
    if(p.learner&&!S.name)S.name=cleanName(p.learner);
    save(); $('#ioMsg').innerHTML=`<div class="feedback fb-good">Imported ${n} new answers from ${esc(p.learner||'learner')}, session ${esc(p.session)}.</div>`;
   }catch(e){ $('#ioMsg').innerHTML=`<div class="feedback fb-bad">That file doesn't look like an Explorer Dash session.</div>`; } };
  r.readAsText(f);
}
function exportAll(){
  const backup={app:'ExplorerDashH2',kind:'full-backup',schemaVersion:SCHEMA,exportedAt:new Date().toISOString(),state:S};
  const blob=new Blob([JSON.stringify(backup)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=`ExplorerDash_H2_FullBackup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  $('#ioMsg').innerHTML=`<div class="feedback fb-good">Backup downloaded to your iCloud folder ✓</div>`;
}

/* ============ boot ============ */
let pencilReviewSyncBound=false;
function bindPencilReviewSync(){
  if(pencilReviewSyncBound)return;
  const sync=window.StudyDashSync;
  if(!sync||typeof sync.onPencilReviews!=='function'||typeof sync.applyPencilReviewsToState!=='function')return;
  pencilReviewSyncBound=true;
  sync.onPencilReviews(reviews=>{
    if(sync.applyPencilReviewsToState(S,reviews)>0){checkBadges();save();}
  });
}
window.addEventListener('studydash-sync-ready',bindPencilReviewSync);
setTimeout(bindPencilReviewSync,0);
go();
</script>
