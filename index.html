<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Decimal Dash</title>
<style>
:root{
  --purple:#6c4ce0; --purple-d:#54389f; --teal:#12b5a5; --teal-d:#0d8c80;
  --bg:#f4f2fc; --card:#ffffff; --ink:#2b2350; --sub:#6f6a8a;
  --good:#1fa552; --bad:#e0485a; --warn:#f2a51a; --line:#e6e2f5;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,'SF Pro Rounded',BlinkMacSystemFont,'Segoe UI',sans-serif;
  height:100%; overscroll-behavior:none;}
#app{max-width:820px;margin:0 auto;padding:14px 16px 40px;min-height:100%;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px;}
.brand{font-weight:800;font-size:20px;color:var(--purple);letter-spacing:.3px;}
.brand span{color:var(--teal);}
.streak{font-weight:700;color:var(--warn);font-size:16px;}
.pbar{height:12px;background:#e4dff7;border-radius:8px;overflow:hidden;margin:2px 0 16px;}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--purple));border-radius:8px;transition:width .4s;}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 3px 14px rgba(80,60,160,.08);margin-bottom:16px;}
.study{border:2px solid var(--purple);border-radius:16px;padding:14px 16px;background:#faf9ff;margin:12px 0;}
.study h4{margin:0 0 8px;color:var(--purple);font-size:15px;}
h1{font-size:26px;margin:8px 0 6px;} h2{font-size:21px;margin:4px 0 10px;}
p{line-height:1.5;} .sub{color:var(--sub);font-size:15px;}
.big{font-size:22px;line-height:1.6;}
.qtext{font-size:22px;line-height:1.7;margin:6px 0 14px;}
.qtext u{text-decoration-color:var(--teal);text-decoration-thickness:3px;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;font-size:.8em;line-height:1.15;}
.frac>span:first-child{border-bottom:2px solid var(--ink);padding:0 4px;}
.frac>span:last-child{padding:0 4px;}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:16px;font-size:19px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:12px;min-height:58px;}
.btn:active{transform:scale(.985);}
.btn-main{background:var(--purple);color:#fff;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-soft{background:#ece8fb;color:var(--purple-d);}
.btn-ghost{background:none;color:var(--sub);font-weight:600;font-size:16px;min-height:44px;padding:10px;}
.btn:disabled{opacity:.45;}
.choices{display:flex;flex-direction:column;gap:10px;margin:10px 0;}
.choices.row{flex-direction:row;} .choices.row .choice{flex:1;text-align:center;font-size:26px;}
.choice{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:20px;
  font-weight:600;font-family:inherit;cursor:pointer;color:var(--ink);}
.choice.sel{border-color:var(--purple);background:#f1edff;}
.answer-row{display:flex;align-items:center;gap:10px;margin:8px 0;}
.answer-row label{font-size:18px;font-weight:700;}
input.ans{flex:1;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:24px;font-family:inherit;
  min-width:120px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none;}
input.ans:focus{outline:none;border-color:var(--teal);}
.canvas-wrap{border:2px dashed #cfc8ee;border-radius:16px;background:#fff;position:relative;margin:12px 0 4px;}
.canvas-label{position:absolute;top:8px;left:12px;color:#b9b2d8;font-size:14px;font-weight:600;pointer-events:none;}
canvas.work{width:100%;height:240px;border-radius:14px;touch-action:none;display:block;}
.tools{display:flex;gap:8px;margin:6px 0 2px;}
.tool{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;
  font-size:15px;font-weight:700;font-family:inherit;color:var(--sub);cursor:pointer;}
.tool.on{border-color:var(--teal);color:var(--teal-d);background:#eafaf8;}
.feedback{border-radius:16px;padding:14px 16px;margin-top:12px;font-size:18px;line-height:1.5;}
.fb-good{background:#e6f7ec;border:2px solid var(--good);}
.fb-bad{background:#fdeef0;border:2px solid var(--bad);}
.fb-hint{background:#fff8e8;border:2px solid var(--warn);}
.sol{background:#f1edff;border:2px solid var(--purple);border-radius:16px;padding:14px 16px;margin-top:12px;font-size:18px;line-height:1.7;}
.mastery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.skill-tile{background:#fff;border-radius:14px;padding:12px;border:2px solid var(--line);}
.skill-tile b{font-size:14px;display:block;margin-bottom:6px;}
.meter{height:10px;background:#eee9fb;border-radius:6px;overflow:hidden;}
.meter>div{height:100%;border-radius:6px;transition:width .5s;}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
.badge{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:700;}
.badge.won{border-color:var(--warn);background:#fff8e8;}
.center{text-align:center;}
.emoji-big{font-size:56px;margin:10px 0;}
.timer{font-size:30px;font-weight:800;color:var(--purple);text-align:center;letter-spacing:1px;}
.timer.low{color:var(--bad);}
table.dash{width:100%;border-collapse:collapse;font-size:15px;}
table.dash th,table.dash td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
.pill{display:inline-block;border-radius:10px;padding:2px 10px;font-size:13px;font-weight:700;color:#fff;}
.pill.g{background:var(--good);} .pill.b{background:var(--bad);} .pill.w{background:var(--warn);}
img.hw{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;}
textarea.note{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:16px;min-height:60px;}
.small{font-size:14px;color:var(--sub);}
.rowflex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
svg.nline{width:100%;height:auto;margin:8px 0;}
.hidden{display:none;}
a.linkbtn{display:block;text-align:center;text-decoration:none;}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const app=document.getElementById('app');
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
/* decimals as scaled integers: fmt(v,dp) -> SA comma string. fmt(1234,2)="12,34" */
function fmt(v,dp){ if(dp===0) return String(v);
  let s=String(Math.abs(v)).padStart(dp+1,'0');
  let w=s.slice(0,-dp), f=s.slice(-dp);
  return (v<0?'−':'')+w+','+f; }
function trimz(str){ /* remove unnecessary zeros from "5,080" -> "5,08" */
  if(!str.includes(',')) return str;
  let [w,f]=str.split(','); f=f.replace(/0+$/,'');
  return f.length? w+','+f : w; }
function parseNum(s){ if(s==null)return null; s=String(s).trim().replace(/\s+/g,'').replace(',','.').replace('−','-');
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return null; return parseFloat(s); }
function numEq(a,b){ return Math.abs(a-b)<1e-9; }
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function parseFrac(s){ /* "3/4", "2 3/4", "0,75", "1,5" -> [num,den] or null */
  if(s==null) return null; s=String(s).trim().replace('−','-');
  let m=s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/); if(m){const w=+m[1],n=+m[2],d=+m[3]; if(!d)return null; return [w*d+(w<0?-n:n), d];}
  m=s.match(/^(-?\d+)\s*\/\s*(\d+)$/); if(m){ if(!+m[2])return null; return [+m[1],+m[2]]; }
  const f=parseNum(s); if(f==null) return null;
  const dp=(String(s).split(/[.,]/)[1]||'').length; const d=Math.pow(10,dp);
  return [Math.round(f*d), d]; }
function fracEq(a,b){ const A=parseFrac(a),B=parseFrac(b); if(!A||!B)return false; return A[0]*B[1]===B[0]*A[1]; }
function isFracForm(s){ return /\//.test(String(s)); }
function isSimplest(s){ const A=parseFrac(s); if(!A) return false;
  const m=String(s).trim().match(/^(?:(-?\d+)\s+)?(-?\d+)\s*\/\s*(\d+)$/);
  if(!m) return false; return gcd(+m[2],+m[3])===1; }
function fr(n,d){ return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>'; }
function mixedfr(w,n,d){ return '<b>'+w+'</b>'+fr(n,d); }
function digitAt(v,dp,col){ /* col: 'tenths'|'hundredths'|'thousandths'|'units'|'tens' for scaled int v,dp */
  const s=String(v).padStart(dp+1,'0'); const w=s.slice(0,s.length-dp)||'0', f=s.slice(s.length-dp);
  switch(col){case 'tenths':return f[0]||'0';case 'hundredths':return f[1]||'0';case 'thousandths':return f[2]||'0';
    case 'units':return w[w.length-1];case 'tens':return w.length>1?w[w.length-2]:'0';case 'hundreds':return w.length>2?w[w.length-3]:'0';}
  return '0';}
function words(n){ /* whole number to words, n < 10000 */
  const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  if(n<20)return ones[n];
  if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
  if(n<1000){const h=ones[Math.floor(n/100)]+' hundred';return n%100?h+' and '+words(n%100):h;}
  const t=ones[Math.floor(n/1000)]+' thousand';const r=n%1000;
  if(!r)return t; if(r<100)return t+' and '+words(r); return t+' '+words(r);}
function digitsInWords(f){ const ones=['zero','one','two','three','four','five','six','seven','eight','nine'];
  return f.split('').map(c=>ones[+c]).join(' ');}
/* ============ skills ============ */
const SKILLS={
 s1:{name:'Place Value & Reading',emoji:'🔍',color:'#6c4ce0',essential:true},
 s2:{name:'Tenths, Hundredths, Thousandths',emoji:'🧩',color:'#12b5a5',essential:true},
 s3:{name:'Zeros & Equal Numbers',emoji:'0️⃣',color:'#f2a51a',essential:false},
 s4:{name:'Fractions ↔ Decimals',emoji:'🔄',color:'#e0485a',essential:true},
 s5:{name:'Compare & Number Lines',emoji:'⚖️',color:'#3b82f6',essential:true},
 s6:{name:'Rounding Off',emoji:'🎯',color:'#8b5cf6',essential:true},
 s7:{name:'Add & Subtract',emoji:'➕',color:'#10b981',essential:true},
 s8:{name:'× and ÷ by 10, 100, 1000',emoji:'🚀',color:'#f97316',essential:true}
};
const LESSONS={
 s1:{title:'Place Value & Reading Decimals',html:
  `<div class="study"><h4>📖 Study</h4><p>Our place value columns are:</p>
   <p class="big center"><b>Th&nbsp;&nbsp;H&nbsp;&nbsp;T&nbsp;&nbsp;U&nbsp;&nbsp;,&nbsp;&nbsp;t&nbsp;&nbsp;h&nbsp;&nbsp;th</b></p>
   <p class="center sub">thousands · hundreds · tens · units · <b>decimal comma</b> · tenths · hundredths · thousandths</p>
   <p>The digits <b>after the comma</b> are called <b>decimal places</b>. Each column is <b>ten times smaller</b> than the one before it.</p>
   <p><b>25,743</b> is said <i>"twenty five comma seven four three"</i>.<br>
   The <b>7</b> is in the <b>tenths</b> column, the <b>4</b> is in the <b>hundredths</b> column and the <b>3</b> is in the <b>thousandths</b> column.</p></div>`},
 s2:{title:'Tenths, Hundredths and Thousandths',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>${fr(3,10)} is written <b>0,3</b> … we say <i>"zero comma three"</i>.</p>
   <p>${fr(2,100)} is written <b>0,02</b> … the 2 must "end up" in the <b>hundredths</b> column.</p>
   <p>${fr(90,1000)} is written <b>0,090 = 0,09</b> … the last digit of the numerator ends up in the <b>thousandths</b> column.</p>
   <p>More than a whole: ${fr(11,10)} = 1${fr(1,10)} = <b>1,1</b> and ${fr(107,100)} = 1${fr(7,100)} = <b>1,07</b>.</p></div>`},
 s3:{title:'Necessary and Unnecessary Zeros',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>A zero <b>after</b> the last decimal place adds <b>no value</b>: <b>0,20 = 0,2</b> and <b>1,60 = 1,6</b>.</p>
   <p>But be careful! A zero <b>between</b> the comma and a digit <b>changes the value</b>:</p>
   <p class="big center"><b>0,08 &lt; 0,8</b></p>
   <p>because 8 <b>hundredths</b> is less than 8 <b>tenths</b>. Only delete zeros at the <b>end</b> of the decimal part.</p></div>`},
 s4:{title:'Fractions ↔ Decimals',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>If the denominator is not 10, 100 or 1000, first make an <b>equivalent fraction</b>:</p>
   <p class="big">${fr(3,5)} <b>=</b> ${fr(6,10)} <b>= 0,6</b> &nbsp;&nbsp;(we multiplied top and bottom by 2)</p>
   <p class="big">${fr(17,50)} <b>=</b> ${fr(34,100)} <b>= 0,34</b> &nbsp;&nbsp;${fr(3,4)} <b>=</b> ${fr(75,100)} <b>= 0,75</b></p>
   <p>Going back: divide top and bottom by the biggest number that divides both:</p>
   <p class="big">0,75 = ${fr(75,100)} = ${fr(3,4)} &nbsp;&nbsp; 0,6 = ${fr(6,10)} = ${fr(3,5)}</p></div>`},
 s5:{title:'Comparing Decimals & Number Lines',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>To compare decimals, compare column by column from the <b>left</b>: units first, then tenths, then hundredths.</p>
   <p class="big">0,5 ? 0,45 → 5 tenths vs 4 tenths → <b>0,5 &gt; 0,45</b> (even though 45 looks bigger!)</p>
   <p>It helps to give both numbers the same number of decimal places: 0,5<b>0</b> vs 0,45.</p>
   <p>On a <b>number line</b>, first work out what each little jump is worth: count the spaces between two labelled numbers.</p></div>`},
 s6:{title:'Rounding Off',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>Look at the digit <b>one place after</b> where you are rounding to. If it is <b>5 or more, round up</b>; if it is 4 or less, the digit stays.</p>
   <p><b>12,53 ≈ 12,5</b> to the nearest tenth (the 3 says stay) … also called <b>one decimal place</b>.</p>
   <p><b>8,719 ≈ 8,72</b> to the nearest hundredth (the 9 says go up) … <b>two decimal places</b>.</p>
   <p><b>147,52 ≈ 148</b> to the nearest whole number (the 5 says go up).</p></div>`},
 s7:{title:'Adding and Subtracting Decimals',html:
  `<div class="study"><h4>📖 Study</h4>
   <p>In your head: think in tenths! <b>0,3 + 0,5</b> is 3 tenths + 5 tenths = 8 tenths = <b>0,8</b>.<br>
   <b>0,6 + 0,4</b> = 10 tenths = <b>1</b> whole. And <b>0,15 + 0,02</b> is 15 hundredths + 2 hundredths = <b>0,17</b>.</p>
   <p>For bigger sums use the <b>column method</b>: write the numbers under each other with the <b>commas lined up</b>.</p>
   <p>Trick for different lengths: <b>82 − 48,5</b> → write 82 as <b>82,0</b> first!</p></div>`},
 s8:{title:'× and ÷ by 10, 100 and 1000',html:
  `<div class="study"><h4>📖 Study</h4>
   <p><b>× 10</b>: every digit moves <b>one column left</b> (× 100 two columns, × 1000 three).</p>
   <p class="big">0,7 × 10 = <b>7</b> &nbsp;(not 0,70!) &nbsp;&nbsp; 1,03 × 10 = <b>10,3</b> &nbsp;&nbsp; 2,08 × 100 = <b>208</b></p>
   <p><b>÷ 10</b>: every digit moves <b>one column right</b> (÷ 100 two, ÷ 1000 three).</p>
   <p class="big">4 ÷ 10 = <b>0,4</b> &nbsp;&nbsp; 2,5 ÷ 10 = <b>0,25</b> &nbsp;&nbsp; 30,5 ÷ 100 = <b>0,305</b></p>
   <p>We <b>never just "add a zero"</b> … the digits shift along the columns.</p></div>`}
};
</script>
<script>
"use strict";
/* ============ question generators ============
   Every item: {type,skill,prompt,input:'text'|'choice'|'compare',choices?,ans,alt?,exact?,fracAns?,
                sol,hints:[h1,h2],marks,diff,src,pencil?}                                   */
let SEQ=0;
function newId(t){return t+'-'+(++SEQ)+'-'+Date.now()%100000;}

function nlineSVG(s0,dp,step,count,letterAt,labelAt){
  const W=700,H=100,x0=30,x1=670;
  const xi=i=>x0+i*((x1-x0)/count);
  let s=`<svg class="nline" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<line x1="${x0-15}" y1="60" x2="${x1+15}" y2="60" stroke="#2b2350" stroke-width="2.5"/>`;
  s+=`<polygon points="${x1+15},60 ${x1+5},55 ${x1+5},65" fill="#2b2350"/>`;
  for(let i=0;i<=count;i++){
    s+=`<line x1="${xi(i)}" y1="50" x2="${xi(i)}" y2="70" stroke="#2b2350" stroke-width="2"/>`;
    if(labelAt.includes(i)) s+=`<text x="${xi(i)}" y="90" font-size="17" text-anchor="middle" fill="#2b2350">${trimz(fmt(s0+i*step,dp))}</text>`;
  }
  for(const L in letterAt){ const i=letterAt[L];
    s+=`<text x="${xi(i)}" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#6c4ce0">${L}</text>`;
    s+=`<line x1="${xi(i)}" y1="34" x2="${xi(i)}" y2="48" stroke="#6c4ce0" stroke-width="2"/>`;}
  return s+'</svg>';
}
function underlineDigit(v,dp,col){
  const str=fmt(v,dp); const ci=str.indexOf(',');
  let idx;
  if(col==='tenths')idx=ci+1; else if(col==='hundredths')idx=ci+2; else if(col==='thousandths')idx=ci+3;
  else if(col==='units')idx=ci-1; else if(col==='tens')idx=ci-2; else idx=ci-3;
  if(idx<0||idx>=str.length||str[idx]===',') return null;
  return str.slice(0,idx)+'<u>'+str[idx]+'</u>'+str.slice(idx+1);
}
function randV(dp,maxWhole){ /* random scaled int with dp decimals, last digit non-zero */
  const w=ri(0,maxWhole); let f;
  do{ f=ri(1,Math.pow(10,dp)-1); }while(f%10===0);
  return w*Math.pow(10,dp)+f;
}
const TYPES={};

/* s1 ---------------------------------------------------------- */
TYPES.pvName={skill:'s1',gen(fx){
  const dp=pick([2,3]); const v=(fx&&fx.v)||randV(dp,ri(9,899));
  const cols=dp===3?['tenths','hundredths','thousandths','units']:['tenths','hundredths','units','tens'];
  const col=(fx&&fx.col)||pick(cols);
  const html=underlineDigit(v,dp,col); if(!html) return TYPES.pvName.gen();
  const ch=shuffle(['tenths','hundredths','thousandths','units','tens'].slice(0,4+ri(0,1)));
  if(!ch.includes(col))ch[0]=col;
  return {type:'pvName',skill:'s1',input:'choice',choices:shuffle(ch),ans:col,marks:1,diff:1,src:'Book Q1.7 p.107',
    prompt:`What is the <b>place value</b> of the underlined digit in <span style="font-size:1.3em"><b>${html}</b></span>?`,
    sol:`Count the columns after the comma: <b>t</b> (tenths), <b>h</b> (hundredths), <b>th</b> (thousandths). The underlined digit sits in the <b>${col}</b> column.`,
    hints:['Say the column names walking right from the comma: tenths, hundredths, thousandths.',
           'Place value is the COLUMN the digit is in, not the digit itself. Which column is the underlined digit in?']};
}};
TYPES.pvDigit={skill:'s1',gen(fx){
  const dp=pick([2,3]); const v=(fx&&fx.v)||randV(dp,ri(9,99));
  const col=(fx&&fx.col)||pick(dp===3?['tenths','hundredths','thousandths']:['tenths','hundredths','units']);
  const d=digitAt(v,dp,col);
  return {type:'pvDigit',skill:'s1',input:'text',ans:String(d),marks:1,diff:1,src:'Book Q1.3–1.6 p.106–107',
    prompt:`Which <b>digit</b> is in the <b>${col}</b> place in <b>${fmt(v,dp)}</b>?`,
    sol:`Columns after the comma go tenths, hundredths, thousandths. In <b>${fmt(v,dp)}</b> the ${col} digit is <b>${d}</b>.`,
    hints:['Find the comma first. Then step through the columns one at a time.',
           `The first digit after the comma is tenths, the second is hundredths, the third is thousandths.`]};
}};
TYPES.pvRing={skill:'s1',gen(){
  const d=ri(1,9); const col=pick(['tenths','units','hundredths']);
  const other=x=>{let k;do{k=ri(1,9);}while(k===d);return k;};
  function build(where){ // digits: T U , t h

TYPES.cmp={skill:'s5',gen(fx){

  else if(kind==='len'){ const w=ri(1,9),t=ri(1,8); A=[w*100+t*10+ri(1,9),2,null]; B=[w*100+(t+1)*10,2,trimz(fmt(w*100+(t+1)*10,2))]; A[2]=fmt(A[0],2); }
  else if(kind==='ten'){ const v=ri(11,99); A=[v*10,2,trimz(fmt(v*10,2))]; B=[v,2,fmt(v,2)]; }

TYPES.round={skill:'s6',gen(fx){
  const t=(fx&&fx.t)!=null?fx.t:pick([0,1,1,2,2,3]);   // target dp
  const dp=Math.min(4,t+pick([1,1,2]));
  let v=(fx&&fx.v)!=null?fx.v:randV(dp,ri(0,199));
  const names={0:['the nearest whole number'],1:['the nearest tenth','one decimal place'],
    2:['the nearest hundredth','two decimal places'],3:['the nearest thousandth','three decimal places']};
  const wording=(fx&&fx.wording)||pick(names[t]);
  const factor=Math.pow(10,dp-t);
  const rv=Math.floor(v/factor)+(((v%factor)*2>=factor)?1:0);   /* exact integer rounding, ,5 rounds up */
  const ansS=t===0?String(rv):fmt(rv,t);
  const decs=String(v).padStart(dp+1,'0').slice(-dp);
  const nextDigit=decs[t]||'0';   /* the single digit just after the rounding position */
  return {type:'round',skill:'s6',input:'text',ans:ansS,marks:1,diff:t===3?3:2,src:'Book Q12 p.114',
    prompt:`Round off <b>${fmt(v,dp)}</b> to <b>${wording}</b>.`,
    sol:`Look at the digit one place further: it is <b>${nextDigit}</b>, so we ${+nextDigit>=5?'round UP':'leave the digit as it is'}: <b>${ansS}</b>.`,
    hints:[`Underline the ${t===0?'units':['tenths','hundredths','thousandths'][t-1]} digit … then look at the ONE digit after it.`,
           '5 or more? Round up. 4 or less? The digit stays. Then cut the rest off.']};
}};

TYPES.patt={skill:'s7',gen(fx){
  const dp=pick([1,2]); const step=pick(dp===1?[1,2,3,4]:[4,5,25]);

  const next=start+(up?3:-3)*step;
  if(next<0) return TYPES.patt.gen(fx);
  const disp=terms.map(v=>trimz(fmt(v,dp))).join(' ; ');
  return {type:'patt',skill:'s7',input:'text',ans:trimz(fmt(next,dp)),marks:1,diff:2,src:'Book Q13.4/13.7 p.115',
    prompt:`Write the <b>next number</b> in the pattern:<br><b style="font-size:1.2em">${disp} ; …</b>`,
    sol:`The pattern ${up?'adds':'subtracts'} <b>${trimz(fmt(step,dp))}</b> each time, so next is <b>${trimz(fmt(next,dp))}</b>.`,
    hints:['How big is the jump from the first number to the second?',
           `The jump is ${trimz(fmt(step,dp))} ${up?'up':'down'} each time.`]};
}};
TYPES.col={skill:'s7',gen(fx){
  const kind=(fx&&fx.kind)||pick(['a','a','s','su','sw']);
  let a,b,dpa,dpb,op;
  if(kind==='a'){dpa=2;dpb=2;a=randV(2,ri(3,80));b=randV(2,ri(1,60));op='+';}
  else if(kind==='s'){dpa=2;dpb=2;a=Math.max(2,randV(2,ri(10,90)));b=randV(2,ri(1,8));if(b>=a)b=ri(1,a-1);op='-';}  // M-01: a>=2 + direct valid b, no unbounded loop
  else if(kind==='su'){dpa=0;dpb=1;a=ri(30,95);b=ri(101,(a-2)*10);op='-';}  // 82 - 48,5
  else {dpa=1;dpb=3;a=ri(101,999);b=ri(1001,9999);while(b/1000>=a/10)b=ri(1001,Math.max(1002,a*100-500));op='-';}
  const dp=Math.max(dpa,dpb);
  const av=a*Math.pow(10,dp-dpa), bv=b*Math.pow(10,dp-dpb);
  const res=op==='+'?av+bv:av-bv;
  const A=trimz(fmt(a,dpa)),B=trimz(fmt(b,dpb)),R=trimz(fmt(res,dp));
  return {type:'col',skill:'s7',input:'text',ans:R,marks:2,diff:kind==='a'||kind==='s'?2:3,src:'Book Q14 p.116',
    prompt:`Use the <b>column method</b> in your writing space: &nbsp; <b style="font-size:1.2em">${A} ${op==='+'?'+':'−'} ${B} = ?</b>`,
    sol:`Line up the commas${dpa!==dpb?` and write ${dpa<dpb?A:B} as ${dpa<dpb?trimz(fmt(av,dp)).includes(',')?fmt(av,dp):fmt(av,dp):fmt(bv,dp)} (add end zeros)`:''}. Then ${op==='+'?'add':'subtract'} column by column: <b>${R}</b>.`,
    hints:['Write the numbers under each other with the commas exactly in line.',
           dpa!==dpb?'The lengths are different! Add end zeros so both have the same number of decimal places.':'Start from the right-most column. Carry or borrow carefully.'],
    pencil:true};
}};
TYPES.wordas={skill:'s7',gen(fx){
  const k=(fx&&fx.k)!=null?fx.k:ri(1,6);
  let prompt,ans,sol,unit='';
  if(k===1){const a=randV(1,ri(30,60)),b=randV(1,ri(3,9));unit=' kg';
    prompt=`Sam weighs <b>${fmt(a,1)} kg</b>. Her brother weighs <b>${fmt(b,1)} kg more</b> than her. What is his mass?`;
    ans=trimz(fmt(a+b,1));sol=`"More than" means add: ${fmt(a,1)} + ${fmt(b,1)} = <b>${ans} kg</b>.`;}
  else if(k===2){const b=ri(150,199),a=randV(2,1);unit=' m';
    prompt=`Thabo is <b>${fmt(a,2)} m</b> tall and Jake is <b>${fmt(b,2)} m</b> tall. What is the difference in height between the two boys?`;
    const d=Math.abs(b-a);ans=trimz(fmt(d,2));sol=`Difference means subtract the smaller from the bigger: <b>${ans} m</b>.`;}
  else if(k===3){const L=ri(8,15),x=randV(2,ri(2,L-2));unit=' km';
    prompt=`A road race is <b>${L} km</b>. After completing <b>${fmt(x,2)} km</b>, how far do I still have to run?`;
    ans=trimz(fmt(L*100-x,2));sol=`${L} km − ${fmt(x,2)} km … write ${L} as ${L},00 and subtract: <b>${ans} km</b>.`;}
  else if(k===4){const s=randV(1,ri(10,40)),a=randV(2,ri(2,Math.floor(s/10)-1));
    prompt=`The sum of two numbers is <b>${fmt(s,1)}</b>. One of the numbers is <b>${fmt(a,2)}</b>. What is the other number?`;
    ans=trimz(fmt(s*10-a,2));sol=`Subtract the number you know from the sum: ${fmt(s,1)} − ${fmt(a,2)} = <b>${ans}</b>.`;}
  else if(k===5){const a=randV(1,ri(10,25)),b=randV(1,ri(10,25));
    prompt=`Find the <b>sum</b> of ${fmt(a,1)} and ${fmt(b,1)}.`;
    ans=trimz(fmt(a+b,1));sol=`Sum means add: <b>${ans}</b>.`;}
  else{const b=ri(16,30),a=randV(1,ri(5,b-2));
    prompt=`What is the <b>difference</b> between ${fmt(a,1)} and ${b}?`;
    ans=trimz(fmt(b*10-a,1));sol=`Write ${b} as ${b},0 and subtract: <b>${ans}</b>.`;}
  return {type:'wordas',skill:'s7',input:'text',ans,unit,marks:2,diff:3,src:'Book Q14.3/Q18.2 p.116/119',
    prompt,sol,hints:['Which operation? "more than" and "sum" say add; "difference" and "still to go" say subtract.',
    'Write it as a number sentence first, then use the column method with commas lined up.'],pencil:true};
}};

/* s8 ---------------------------------------------------------- */
TYPES.x10={skill:'s8',gen(fx){
  const e=(fx&&fx.e)||pick([1,1,2,2,3]); const k=Math.pow(10,e);
  const dp=(fx&&fx.dp)!=null?fx.dp:pick([1,2,2,3]); const v=(fx&&fx.v)!=null?fx.v:randV(dp,ri(0,60));
  const nd=dp-e; const ansS=nd>0?fmt(v,nd):String(v*Math.pow(10,-nd));
  return {type:'x10',skill:'s8',input:'text',ans:ansS,marks:1,diff:e===1?1:2,src:'Book Q15 p.117',
    prompt:`Calculate: &nbsp; <b style="font-size:1.2em">${fmt(v,dp)} × ${k} = ?</b>`,
    sol:`× ${k} moves every digit <b>${e} column${e>1?'s':''} left</b>: <b>${ansS}</b>. (We never just "add zeros"!)`,
    hints:[`Every digit moves ${e} place${e>1?'s':''} to the LEFT.`,
           'Slide the digits, keep the comma still. Fill gaps with zeros if needed.']};
}};
TYPES.d10={skill:'s8',gen(fx){
  const e=(fx&&fx.e)||pick([1,1,2,2,3]); const k=Math.pow(10,e);
  const dp=(fx&&fx.dp)!=null?fx.dp:pick([0,0,1,1,2]); const v=(fx&&fx.v)!=null?fx.v:(dp===0?ri(2,90):randV(dp,ri(0,60)));
  const nd=dp+e; const ansS=fmt(v,nd);
  return {type:'d10',skill:'s8',input:'text',ans:ansS,alt:[trimz(ansS)],marks:1,diff:e===1?1:2,src:'Book Q16 p.118',
    prompt:`Calculate: &nbsp; <b style="font-size:1.2em">${dp===0?v:fmt(v,dp)} ÷ ${k} = ?</b>`,
    sol:`÷ ${k} moves every digit <b>${e} column${e>1?'s':''} right</b>: <b>${trimz(ansS)}</b>.`,
    hints:[`Every digit moves ${e} place${e>1?'s':''} to the RIGHT.`,
           'The number gets smaller. Fill empty columns with zeros: 0,0…']};
}};
TYPES.sent={skill:'s8',gen(fx){
  const k=(fx&&fx.k)!=null?fx.k:ri(1,3);
  let prompt,ans,sol;
  if(k===1){const dp=pick([2,3]);const v=randV(dp,0);const m=pick([100,1000]);
    const e=Math.log10(m);const nd=dp-e;const A=nd>0?fmt(v,nd):String(v*Math.pow(10,-nd));
    prompt=`Calculate the <b>product</b> of ${fmt(v,dp)} and ${m}.`;ans=A;
    sol=`Product means multiply: ${fmt(v,dp)} × ${m} = <b>${A}</b> (digits move ${e} columns left).`;}
  else if(k===2){const v=randV(1,ri(10,99));const m=pick([10,100]);const e=Math.log10(m);
    const A=fmt(v,1+e);prompt=`What is ${fmt(v,1)} <b>divided</b> by ${m}?`;ans=trimz(A);
    sol=`${fmt(v,1)} ÷ ${m} = <b>${trimz(A)}</b> (digits move ${e} column${e>1?'s':''} right).`;}
  else{const v=ri(11,99);const m=pick([10,100]);const e=Math.log10(m);
    const F=trimz(fmt(v,e)); ans=F;
    prompt=`Calculate the product of 10 and ${fmt(v,1)}. Then <b>divide your answer by ${m}</b>.`;
    sol=`${fmt(v,1)} × 10 = ${v}. Then ${v} ÷ ${m} = <b>${F}</b>.`;}
  return {type:'sent',skill:'s8',input:'text',ans,marks:2,diff:3,src:'Book Q18.2 p.119',prompt,sol,
    hints:['"Product" means multiply. "Divided by" means ÷.','Digits slide left for ×, right for ÷.'],pencil:true};
}};
TYPES.wordmd={skill:'s8',gen(fx){
  const k=(fx&&fx.k)!=null?fx.k:ri(1,5);
  let prompt,ans,sol;
  if(k===1){const L=randV(1,ri(2,9));
    prompt=`A rope is <b>${fmt(L,1)} m</b> long. It is cut into <b>10 pieces</b> of equal length. Calculate the length of each piece, in metres.`;
    ans=trimz(fmt(L,2));sol=`${fmt(L,1)} ÷ 10 = <b>${ans} m</b> (digits move one column right).`;}
  else if(k===2){const m=randV(1,ri(3,9));
    prompt=`There are <b>100 sachets</b> of sugar weighing <b>${fmt(m,1)} g</b> each. Calculate the total mass of the sugar sachets.`;
    ans=String(m*10);sol=`${fmt(m,1)} × 100 = <b>${m*10} g</b> (digits move two columns left).`;}
  else if(k===3){const p=randV(2,ri(10,19)),q=randV(2,ri(20,29));
    prompt=`You pay with a <b>R50</b> note for items costing <b>R${fmt(p,2)}</b> and <b>R${fmt(q,2)}</b>. How much change do you receive?`;
    ans=trimz(fmt(5000-p-q,2));sol=`First add: R${fmt(p,2)} + R${fmt(q,2)} = R${fmt(p+q,2)}. Then R50,00 − R${fmt(p+q,2)} = <b>R${trimz(fmt(5000-p-q,2))}</b>.`;}
  else if(k===4){const D=ri(105,205);
    prompt=`Jane must run <b>${D} km</b> over <b>10 days</b>. How far must she run each day if she runs equal daily distances?`;
    ans=trimz(fmt(D,1));sol=`${D} ÷ 10 = <b>${trimz(fmt(D,1))} km</b>.`;}
  else{const P=randV(1,ri(20,90));const m=pick([10,100]);const e=Math.log10(m);
    prompt=`The product of two numbers is <b>${fmt(P,1)}</b>. The one number is <b>${m}</b>. What is the other number?`;
    ans=trimz(fmt(P,1+e));sol=`Work backwards: ${fmt(P,1)} ÷ ${m} = <b>${trimz(fmt(P,1+e))}</b>.`;}
  return {type:'wordmd',skill:'s8',input:'text',ans,marks:2,diff:3,src:'Book Q19 p.119',prompt,sol,
    hints:['Sharing into 10 equal parts means ÷ 10. "Each" with 100 of them means × 100.',
           'Write the number sentence first, then slide the digits.'],pencil:true};
}};

const SKILL_TYPES={
 s1:['pvName','pvDigit','pvRing','words','expand'],
 s2:['f10','f100','f1000','fsum'],
 s3:['zdel','ztf','zeq'],
 s4:['equiv','f2d','d2f'],

function makeItem(typeid,fx){ const it=TYPES[typeid].gen(fx||null); it.id=newId(typeid); return it; }
function makeFromSkill(skill,diffCap){
  for(let tries=0;tries<8;tries++){
    const t=pick(SKILL_TYPES[skill]); const it=makeItem(t);
    if(!diffCap||it.diff<=diffCap) return it; }
  return makeItem(pick(SKILL_TYPES[skill]));
}

  items.forEach(i=>{i.marks=1;});  /* exam Q8 = 10 marks over 10 items */

<script>
"use strict";
/* ============ state ============ */
const DEFAULT={name:'',pin:'',session:0,step:0,qi:0,cur:null,log:[],retryQueue:[],
  mastery:{s1:50,s2:50,s3:50,s4:50,s5:50,s6:50,s7:50,s8:50},
  streak:0,best:0,badges:[],stars:0,stretch:[false,false,false,false],
  mockScore:null,mockTotal:10,done:[false,false,false,false],overrides:{},comments:{}};
let S=load();
function cleanName(s){ return String(s||'').trim().replace(/[\s\-−–—]+$/,''); }
function load(){ try{ const j=localStorage.getItem('dd1'); if(j){ const o=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(j)); o.name=cleanName(o.name); return o; } }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT)); }
function save(){ try{ localStorage.setItem('dd1',JSON.stringify(S)); }catch(e){ /* quota: drop oldest pngs */
  for(const a of S.log){ if(a.png){a.png=null;a.pngDropped=true;} if(JSON.stringify(S).length<4000000)break; }
  try{localStorage.setItem('dd1',JSON.stringify(S));}catch(e2){} } }

/* ============ adaptive helpers ============ */
function weakOrder(){ return Object.keys(SKILLS).sort((a,b)=>
  (S.mastery[a]-(SKILLS[a].essential?15:0))-(S.mastery[b]-(SKILLS[b].essential?15:0))); }
function pickPracticeItems(n,cap){
  const w=weakOrder(); const pool=[w[0],w[0],w[1],w[1],w[2],w[3]];
  const items=[]; for(let i=0;i<n;i++) items.push(makeFromSkill(pool[i%pool.length],cap));
  return shuffle(items); }
function masteredSkills(){ return Object.keys(SKILLS).filter(s=>S.mastery[s]>=70); }
function confidenceItems(n){
  const ms=masteredSkills(); const src=ms.length?ms:weakOrder().slice(-3);
  const items=[];for(let i=0;i<n;i++)items.push(makeFromSkill(pick(src),2));
  return items; }
function updateMastery(skill,firstTry,correct,hints){
  let d; if(correct&&firstTry&&!hints)d=14; else if(correct&&firstTry)d=8; else if(correct)d=5; else d=-12;
  S.mastery[skill]=Math.max(0,Math.min(100,S.mastery[skill]+d)); }

/* ============ badges ============ */
const BADGES={
 pv:{name:'Place Value Pro 🔍',test:()=>S.mastery.s1>=80},
 zero:{name:'Zero Hero 0️⃣',test:()=>S.mastery.s3>=80},
 round:{name:'Rounding Ranger 🎯',test:()=>S.mastery.s6>=80},
 conv:{name:'Conversion Champ 🔄',test:()=>S.mastery.s4>=80},
 rocket:{name:'Rocket Shifter 🚀',test:()=>S.mastery.s8>=80},
 streak5:{name:'On Fire! 🔥 (5 in a row)',test:()=>S.streak>=5},
 streak10:{name:'Unstoppable ⚡ (10 in a row)',test:()=>S.streak>=10},
 sess1:{name:'Detective 🕵️ (Session 1 done)',test:()=>S.done[0]},
 sess2:{name:'Builder 🏗️ (Session 2 done)',test:()=>S.done[1]},
 sess3:{name:'Trap Master 🪤 (Session 3 done)',test:()=>S.done[2]},
 ace:{name:'Exam Ace 🏆 (8+ in the mock)',test:()=>S.mockScore!=null&&S.mockScore>=8}};
function checkBadges(){ const won=[];
  for(const k in BADGES){ if(!S.badges.includes(k)&&BADGES[k].test()){S.badges.push(k);won.push(BADGES[k].name);} }
  return won; }

/* ============ sessions ============ */
const SESSIONS=[
 {name:'Find the gaps 🕵️',steps:[
   {k:'screen',id:'w1'},
   {k:'quiz',mode:'warm',make:()=>[makeItem('f10',{kind:'p'}),makeItem('pvDigit'),makeItem('x10',{e:1,dp:1})]},
   {k:'screen',id:'prediag'},
   {k:'quiz',mode:'diag',make:diagnosticSet},
   {k:'screen',id:'reveal'},
   {k:'lesson',weak:0},{k:'quiz',mode:'practice',weak:0,n:4},
   {k:'lesson',weak:1},{k:'quiz',mode:'practice',weak:1,n:4},
   {k:'screen',id:'submit'}]},
 {name:'Build strength 🏗️',steps:[
   {k:'screen',id:'w2'},
   {k:'quiz',mode:'practice',make:()=>{const w=weakOrder();return [makeFromSkill(w[0]),makeFromSkill(w[1])];}},
   {k:'lesson',weak:0},{k:'quiz',mode:'practice',weak:0,n:4},
   {k:'lesson',weak:1},{k:'quiz',mode:'practice',weak:1,n:4},
   {k:'screen',id:'mixintro'},
   {k:'quiz',mode:'practice',n:8},
   {k:'screen',id:'submit'}]},
 {name:'Fix and sharpen 🔧',steps:[
   {k:'screen',id:'w3'},
   {k:'quiz',mode:'retry'},
   {k:'screen',id:'trapintro'},
   {k:'quiz',mode:'trap',make:trapSet},
   {k:'quiz',mode:'practice',n:8},
   {k:'screen',id:'submit'}]},
 {name:'Match day rehearsal 🏆',steps:[
   {k:'screen',id:'mockintro'},
   {k:'quiz',mode:'mock',make:mockSet},
   {k:'screen',id:'mockresult'},
   {k:'quiz',mode:'corrections'},
   {k:'screen',id:'confintro'},
   {k:'quiz',mode:'confidence',n:6},
   {k:'screen',id:'submit'}]}];

/* ============ answer checking ============ */
function stripUnits(s){ return String(s).replace(/(r|kg|km|g|m|metres|meters|grams)\b/gi,'').replace(/[Rr]\s*(?=\d)/,'').trim(); }
function checkAnswer(item,user){
  if(item.input==='choice'||item.input==='compare') return user===item.ans;
  let u=String(user||'').trim(); if(!u) return false;
  if(item.exact){ const norm=x=>x.replace(/\s+/g,'').replace('.',','); return norm(u)===norm(item.ans); }
  if(item.fracAns){ if(!isFracForm(u)) return false;
    return fracEq(u,item.ans)&&isSimplest(u); }
  u=stripUnits(u);
  const un=parseNum(u); if(un==null) return false;
  const list=[item.ans].concat(item.alt||[]);
  return list.some(a=>{const an=parseNum(String(a)); return an!=null&&numEq(un,an);});
}

/* ============ rendering ============ */
function header(pct){
  const st=S.streak>=2?`<span class="streak">🔥 ${S.streak}</span>`:`<span class="streak">⭐ ${S.stars}</span>`;
  return `<div class="topbar"><div class="brand">Decimal <span>Dash</span></div>${st}</div>
    <div class="pbar"><div style="width:${pct||0}%"></div></div>`; }
function sessionPct(){
  const st=SESSIONS[S.session]; if(!st) return 100;
  let total=st.steps.length,done=S.step;
  return Math.round(100*Math.min(done,total)/total); }
function render(html){ app.innerHTML=html; window.scrollTo(0,0); }

function go(){ save();
  if(!S.name){ renderFirstRun(); return; }
  if(S.session>=4){ renderAllDone(); return; }
  const st=SESSIONS[S.session].steps[S.step];
  if(!st){ S.step=0; S.session++; save(); go(); return; }
  if(st.k==='screen') renderScreen(st.id);
  else if(st.k==='lesson') renderLesson(st);
  else if(st.k==='quiz') startQuiz(st);
}
function nextStep(){ S.step++; S.qi=0; S.cur=null; save(); go(); }

/* ---------- first run & home ---------- */
function renderFirstRun(){
  render(`${header(0)}<div class="card center">
    <div class="emoji-big">👋</div><h1>Hello! I'm Decimal Dash.</h1>
    <p class="big">I'm going to help you become a <b>Decimal Fractions star</b> before your exam.</p>
    <p class="sub">What is your name?</p>
    <input class="ans" id="nm" style="width:80%" placeholder="Type your name">
    <button class="btn btn-main" onclick="const v=cleanName($('#nm').value); if(v){S.name=v;save();go();}">Let's go! 🚀</button>
    <button class="btn btn-ghost" onclick="renderParentGate()">Parent corner</button></div>`);
}
function renderAllDone(){
  render(`${header(100)}<div class="card center"><div class="emoji-big">🌟</div>
    <h1>You did it, ${esc(S.name)}!</h1>
    <p class="big">All four sessions are finished. You are ready for your exam. Sleep well and believe in yourself!</p>
    ${badgeWall()}
    <button class="btn btn-soft" onclick="renderMastery(()=>renderAllDone())">See my skill map 🗺️</button>
    <button class="btn btn-ghost" onclick="renderParentGate()">Parent corner</button></div>`);
}
function badgeWall(){
  if(!S.badges.length) return '';
  return `<div class="badges">${S.badges.map(k=>`<span class="badge won">${BADGES[k].name}</span>`).join('')}</div>`; }

/* ---------- static screens ---------- */
const SCREENS={
 w1:()=>({t:`Hi ${esc(S.name)}! 👋`,h:`<p class="big">Welcome to <b>Session 1: Find the gaps</b> 🕵️</p>
   <p>First a quick warm up, then a detective mission to find out which decimal skills are already strong and which ones we'll power up together.</p>
   <p class="sub">You'll need your Apple Pencil for working out. Ready?</p>`,b:'Start warm up ✨'}),
 prediag:()=>({t:'Detective mission 🔎',h:`<p class="big">16 questions, all different kinds.</p>

 reveal:()=>{ const won=checkBadges(); return {t:'Mission complete! 🎉',h:`
   <p class="big">Here is your skill map, ${esc(S.name)}:</p>${masteryHTML()}

 w2:()=>({t:`Welcome back, ${esc(S.name)}! 🏗️`,h:`<p class="big"><b>Session 2: Build strength</b></p>
   <p>Quick recap of this morning, then two more power ups and a big mixed round. Pencil ready!</p>`,b:'Start recap 🔁'}),
 mixintro:()=>({t:'Mixed round! 🎲',h:`<p class="big">Now the questions come in any order, just like in the exam.</p>
   <p>Take a breath, read carefully, and trust your working.</p>`,b:'Bring it on 💪'}),
 w3:()=>({t:`Day 2, ${esc(S.name)}! 🔧`,h:`<p class="big"><b>Session 3: Fix and sharpen</b></p>
   <p>First we'll fix yesterday's tricky ones … they're back in new clothes! Then a special <b>Trap Spotter</b> round.</p>`,b:"Let's fix them 🔨"}),
 trapintro:()=>({t:'Trap Spotter! 🪤',h:`<p class="big">Examiners love little traps. You are about to out-smart all of them.</p>
   <p>Watch out for sneaky zeros, digits that jump columns, and numbers that <i>look</i> bigger but aren't!</p>`,b:'Spot the traps 👀'}),
 mockintro:()=>({t:'Match day rehearsal 🏆',h:`<p class="big">This is a practice exam question, just like the real one: <b>10 marks</b>.</p>
   <p>⏱ You have <b>25 minutes</b>. No hints this time … show all your working with your Pencil, exactly like in the exam. You'll see your marks at the end.</p>`,b:'Start the exam ⏱'}),
 mockresult:()=>{ checkBadges(); const sc=S.mockScore,msg=sc>=8?'Outstanding! You are exam ready! 🏆':sc>=6?'Strong work! A little polish and you are there. 💪':'Good effort! We know exactly what to fix now. 🔧';
   return {t:`Your mock result: ${sc} / ${S.mockTotal}`,h:`<div class="emoji-big center">${sc>=8?'🏆':sc>=6?'🌟':'💪'}</div>

 submit:()=>({t:'',h:'',b:''})};
function renderScreen(id){
  if(id==='submit'){ renderSubmit(); return; }
  const sc=SCREENS[id]();
  const extra=(id==='w1'||id==='w2'||id==='w3')?

  render(`${header(sessionPct())}<div class="card">${sc.t?`<h1>${sc.t}</h1>`:''}${sc.h}
    <button class="btn btn-main" onclick="nextStep()">${sc.b}</button>${extra}</div>`);

function masteryHTML(){
  return `<div class="mastery">${Object.keys(SKILLS).map(s=>{
    const m=S.mastery[s],c=m>=70?'#1fa552':m>=45?'#f2a51a':'#e0485a';
    return `<div class="skill-tile"><b>${SKILLS[s].emoji} ${SKILLS[s].name}</b>
      <div class="meter"><div style="width:${m}%;background:${c}"></div></div></div>`;}).join('')}</div>`; }
function renderMastery(back){
  render(`${header(sessionPct())}<div class="card"><h2>My skill map 🗺️</h2>${masteryHTML()}${badgeWall()}
    <button class="btn btn-main" id="backbtn">Back</button></div>`);
  $('#backbtn').onclick=back; }

/* ---------- lessons ---------- */
function renderLesson(st){
  const w=weakOrder(); const skill=w[st.weak]; st._skill=skill;
  S['lessonSkill'+st.weak]=skill; save();
  const L=LESSONS[skill];
  render(`${header(sessionPct())}<div class="card">
    <h2>${SKILLS[skill].emoji} Power up: ${L.title}</h2>${L.html}
    <p class="sub">Read it slowly … then let's try some together!</p>
    <button class="btn btn-main" onclick="nextStep()">I'm ready ✏️</button></div>`);
}

/* ---------- quiz engine ---------- */
let T0=0, hintsUsed=0, attemptNo=1;
let clockTimer=null, advTimer=null, qLock=false;  // owned timers + one-shot submit lock (H-04)
function startQuiz(st){
  if(!S.cur){
    let items;
    if(st.make) items=st.make();
    else if(st.mode==='retry'){
      const q=S.retryQueue.splice(0,8);
      items=q.length?q.map(r=>makeItem(r.type)):pickPracticeItems(5);
    }
    else if(st.mode==='corrections'){
      const wrong=S.log.filter(a=>a.mode==='mock'&&!a.correct);
      items=wrong.length?wrong.map(a=>makeItem(a.type)):confidenceItems(3);
    }
    else if(st.mode==='confidence') items=confidenceItems(st.n||6);
    else if(st.weak!=null){ const skill=S['lessonSkill'+st.weak]||weakOrder()[st.weak];
      items=[];for(let i=0;i<(st.n||4);i++)items.push(makeFromSkill(skill)); }
    else items=pickPracticeItems(st.n||8);
    S.cur={mode:st.mode,items:items,started:Date.now()};
    if(st.mode==='mock'){S.cur.deadline=Date.now()+25*60*1000;S.cur.mockStart=Date.now();}
    S.qi=0; save();
  }
  renderQuestion();
}
function curItem(){ return S.cur.items[S.qi]; }
function renderQuestion(){
  const it=curItem();
  if(!it){ finishQuiz(); return; }
  T0=Date.now(); hintsUsed=0; attemptNo=1; selVal=null; clearTimeout(clockTimer); clearTimeout(advTimer); qLock=false;
  const mode=S.cur.mode;
  const n=S.cur.items.length;
  const label={warm:'Warm up',diag:'Detective mission',practice:'Practice',trap:'Trap Spotter',
    mock:'PRACTICE EXAM',retry:'Fix it',corrections:'Fix my slips',confidence:'Victory lap'}[mode]||'Practice';
  let inputHtml='';
  if(it.input==='text') inputHtml=`<div class="answer-row"><label>Answer:</label>
      <input class="ans" id="ansIn" type="text" inputmode="${it.fracAns?'text':'decimal'}" enterkeyhint="done"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="${it.placeholder||'Type your answer here'}"></div>`;
  else if(it.input==='compare') inputHtml=`<div class="choices row">
      <button class="choice" data-v="&gt;" onclick="selChoice(this)">&gt;</button>
      <button class="choice" data-v="&lt;" onclick="selChoice(this)">&lt;</button>
      <button class="choice" data-v="=" onclick="selChoice(this)">=</button></div>`;
  else inputHtml=`<div class="choices">${it.choices.map(c=>
      `<button class="choice" data-v="${esc(c)}" onclick="selChoice(this)">${esc(c)}</button>`).join('')}</div>`;
  render(`${header(sessionPct())}
   <div class="card">
    <p class="sub">${label} · Question ${S.qi+1} of ${n}${mode==='mock'?` · <span id="clock" class="timer" style="font-size:18px;display:inline"></span>`:''}</p>
    <div class="qtext">${it.prompt}</div>
    <div class="canvas-wrap"><span class="canvas-label">✏️ Show your working here</span><canvas class="work" id="cv"></canvas></div>
    <div class="tools">
      <button class="tool on" id="penB" onclick="setTool('pen')">✏️ Pen</button>
      <button class="tool" id="erB" onclick="setTool('eraser')">🧽 Eraser</button>
      <button class="tool" onclick="undoStroke()">↩️ Undo</button>
      <button class="tool" onclick="clearCanvas()">🗑 Clear</button></div>
    ${inputHtml}
    <div id="fb"></div>
    <button class="btn btn-teal" id="checkBtn" onclick="doCheck()">Check ✓</button>
   </div>`);
  initCanvas();
  if(mode==='mock') tickClock();
  const ai=$('#ansIn'); if(ai){
    ai.addEventListener('keydown',e=>{if(e.key==='Enter')doCheck();});
    ai.addEventListener('click',()=>ai.focus()); } /* belt & braces: finger tap always focuses + opens keyboard */
}
let selVal=null;
function selChoice(btn){ selVal=btn.getAttribute('data-v').replace('&gt;','>').replace('&lt;','<');
  document.querySelectorAll('.choice').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); }
function tickClock(){ clearTimeout(clockTimer);
  const el=$('#clock'); if(!el||!S.cur||!S.cur.deadline) return;
  const left=Math.max(0,S.cur.deadline-Date.now());
  const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  el.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
  if(left<5*60*1000) el.classList.add('low');
  if(left<=0){ finishQuiz(); return; }
  clockTimer=setTimeout(tickClock,1000);
}
function getUserAnswer(){ const it=curItem();
  if(it.input==='text'){ const el=$('#ansIn'); return el?el.value:''; }
  return selVal; }
function qToken(){ return S.cur?(S.session+":"+S.qi+":"+S.cur.mode):null; }
function scheduleAdvance(delay){ clearTimeout(advTimer); const tok=qToken(); advTimer=setTimeout(()=>{ if(!S.cur||qToken()!==tok) return; S.qi++; save(); renderQuestion(); }, delay); }
function doCheck(){ if(qLock) return;
  const it=curItem(); const user=getUserAnswer();
  if(user==null||String(user).trim()===''){ showFB('hint','✏️ Write your answer first … you can do it!'); return; }
  const ok=checkAnswer(it,user);
  const mode=S.cur.mode;
  if(mode==='diag'||mode==='mock'){ qLock=true; recordAttempt(it,user,ok,true); selVal=null;
    showFB('good',mode==='diag'?'Answer locked in! 🔒':'Saved ✓ … next one!');
    disableCheck(); scheduleAdvance(700); return; }
  if(ok){
    qLock=true; const first=(attemptNo===1);
    recordAttempt(it,user,true,first);
    if(first&&!hintsUsed){S.streak++;S.best=Math.max(S.best,S.streak);S.stars++;}
    else S.streak=0;
    const won=checkBadges();
    const cheers=['Brilliant! 🌟','Yes! Nailed it! 🎯','Superstar! ⭐','You got it! 🙌','Perfect! 💯','Sharp thinking! 🧠'];
    showFB('good',`${pick(cheers)}${won.length?'<br>🏅 New badge: <b>'+won.join(', ')+'</b>!':''}`);
    disableCheck();
    scheduleAdvance(1100);
  } else {
    if(attemptNo===1){ attemptNo=2; hintsUsed++;
      showFB('hint',`🤔 Not quite … here's a hint:<br><b>${it.hints[0]}</b><br><span class="small">Fix your working and try again!</span>`);
    } else {
      qLock=true; recordAttempt(it,user,false,false); S.streak=0;
      S.retryQueue.push({type:it.type,reason:'auto'});
      showFB('bad',`Almost! The answer is <b>${esc(it.ans)}</b>.`);
      $('#fb').insertAdjacentHTML('beforeend',`<div class="sol"><b>💡 How it works:</b><br>${it.sol}</div>
        <button class="btn btn-main" onclick="S.qi++;save();renderQuestion()">Got it, next! →</button>`);
      disableCheck();
    }
  }
}
function disableCheck(){ const b=$('#checkBtn'); if(b)b.disabled=true; }
function showFB(kind,msg){ $('#fb').innerHTML=`<div class="feedback fb-${kind}">${msg}</div>`; }
function recordAttempt(it,user,correct,firstTry){
  const png=canvasDirty()?exportCanvas():null;
  updateMastery(it.skill,firstTry,correct,hintsUsed);
  S.log.push({id:it.id,type:it.type,skill:it.skill,mode:S.cur.mode,session:S.session,
    prompt:it.prompt,ans:it.ans,user:String(user),correct,firstTry,hints:hintsUsed,
    marks:correct?it.marks:0,maxMarks:it.marks,timeS:Math.round((Date.now()-T0)/1000),
    png,ts:Date.now()});
  save();
}
function finishQuiz(){ clearTimeout(clockTimer); clearTimeout(advTimer);
  const mode=S.cur.mode;
  if(mode==='mock'){ const start=(S.cur&&S.cur.mockStart)||0; S.mockScore=S.log.filter(a=>a.mode==='mock'&&a.correct&&(a.ts||0)>=start).reduce((t,a)=>t+a.maxMarks,0);
    if(S.mockScore>S.mockTotal)S.mockScore=S.mockTotal; }  // H-04: only this mock run counts
  S.cur=null;
  nextStepMaybeStretch();
}
function nextStepMaybeStretch(){
  const mid=Math.floor(SESSIONS[S.session].steps.length/2);
  if(!S.stretch[S.session]&&S.step===mid){
    S.stretch[S.session]=true; S.step++; save();
    render(`${header(sessionPct())}<div class="card center"><div class="emoji-big">🤸</div>
      <h2>Quick stretch?</h2><p class="big">You're doing great! Stand up, shake your arms, take three deep breaths … then come back.</p>
      <button class="btn btn-main" onclick="go()">I'm back! 💪</button>
      <button class="btn btn-ghost" onclick="go()">Skip … I'm on a roll 🔥</button></div>`);
    return; }
  nextStep();
}
</script>
<script>
"use strict";
/* ============ Apple Pencil canvas ============ */
let cv=null,cctx=null,strokes=[],curStroke=null,tool='pen';
function initCanvas(){
  cv=$('#cv'); if(!cv) return;
  const w=cv.clientWidth||700,h=cv.clientHeight||240,dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=w*dpr; cv.height=h*dpr;
  cctx=cv.getContext('2d'); cctx.scale(dpr,dpr);
  cv._w=w; cv._h=h; strokes=[]; tool='pen'; redraw();
  cv.addEventListener('pointerdown',penDown,{passive:false});
  cv.addEventListener('pointermove',penMove,{passive:false});
  cv.addEventListener('pointerup',penUp); cv.addEventListener('pointercancel',penUp);
}
function pos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function penDown(e){ e.preventDefault(); cv.setPointerCapture(e.pointerId);
  curStroke={tool,pts:[pos(e)],w:tool==='pen'?(e.pointerType==='pen'?2.2:2.6):22}; strokes.push(curStroke); redraw(); }
function penMove(e){ if(!curStroke) return; e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of evs) curStroke.pts.push(pos(ev)); redraw(); }
function penUp(){ curStroke=null; }
function setTool(t){ tool=t; $('#penB').classList.toggle('on',t==='pen'); $('#erB').classList.toggle('on',t==='eraser'); }
function undoStroke(){ strokes.pop(); redraw(); }
function clearCanvas(){ strokes=[]; redraw(); }
function redraw(){ if(!cctx) return;
  cctx.fillStyle='#fff'; cctx.fillRect(0,0,cv._w,cv._h);
  cctx.strokeStyle='#eef0f6'; cctx.lineWidth=1;
  for(let y=30;y<cv._h;y+=30){cctx.beginPath();cctx.moveTo(0,y);cctx.lineTo(cv._w,y);cctx.stroke();}
  for(const s of strokes){ cctx.strokeStyle=s.tool==='pen'?'#1c2440':'#ffffff';
    cctx.lineWidth=s.w; cctx.lineCap='round'; cctx.lineJoin='round';
    cctx.beginPath(); const p=s.pts; cctx.moveTo(p[0][0],p[0][1]);
    for(let i=1;i<p.length;i++)cctx.lineTo(p[i][0],p[i][1]); cctx.stroke(); }
}
function canvasDirty(){ return strokes.some(s=>s.tool==='pen'); }
function exportCanvas(){
  const W=620,sx=W/(cv._w||W),H=Math.ceil((cv._h||240)*sx);
  const off=document.createElement('canvas'); off.width=W; off.height=H;
  const c=off.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,W,H);
  for(const s of strokes){ c.strokeStyle=s.tool==='pen'?'#1c2440':'#ffffff';
    c.lineWidth=s.w*sx; c.lineCap='round'; c.lineJoin='round';
    c.beginPath(); const p=s.pts; c.moveTo(p[0][0]*sx,p[0][1]*sx);
    for(let i=1;i<p.length;i++)c.lineTo(p[i][0]*sx,p[i][1]*sx); c.stroke(); }
  return off.toDataURL('image/jpeg',0.55);
}

/* ============ submit ============ */
function sessionAttempts(n){ return S.log.filter(a=>a.session===n); }
function summaryText(n){
  const at=sessionAttempts(n); const ok=at.filter(a=>a.correct).length;
  const w=weakOrder();
  let t=`Decimal Dash — ${S.name}, Session ${n+1} done! ✅ ${ok}/${at.length} correct`;
  if(n===3&&S.mockScore!=null)t+=` · Mock exam: ${S.mockScore}/${S.mockTotal}`;
  t+=`. Strongest: ${SKILLS[w[7]].name}. Working on: ${SKILLS[w[0]].name}.`;
  return t; }
function buildPackage(n){
  return JSON.stringify({app:'DecimalDash',version:1,learner:S.name,session:n+1,
    date:new Date().toISOString(),mastery:S.mastery,mockScore:S.mockScore,
    badges:S.badges.map(k=>BADGES[k].name),bestStreak:S.best,stars:S.stars,
    retryQueue:S.retryQueue,attempts:sessionAttempts(n)}); }
function renderSubmit(){
  const n=S.session; const at=sessionAttempts(n); const ok=at.filter(a=>a.correct).length;
  const final=n===3; const won=checkBadges();
  render(`${header(96)}<div class="card center">
    <div class="emoji-big">${final?'🏆':'🎉'}</div>
    <h1>Session ${n+1} finished!</h1>
    <p class="big">You answered <b>${ok} of ${at.length}</b> correctly${n===3&&S.mockScore!=null?` and scored <b>${S.mockScore}/${S.mockTotal}</b> in your practice exam`:''}. ${ok/Math.max(1,at.length)>=0.75?'Amazing work! 🌟':'Great effort! 💪'}</p>
    ${won.length?`<div class="badges">${won.map(b=>`<span class="badge won">${b}</span>`).join('')}</div>`:''}
    <p class="sub">Now send your work to Dad with one tap:</p>
    <button class="btn btn-main" onclick="doSubmit(${n})">📤 Submit my work</button>
    <div id="afterSubmit"></div></div>`);
}
function doSubmit(n){
  const blob=new Blob([buildPackage(n)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`DecimalDash_Session${n+1}_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  const txt=encodeURIComponent(summaryText(n));
  $('#afterSubmit').innerHTML=`
    <div class="feedback fb-good">Your work has been saved and sent to your iCloud folder ✓</div>
    <a class="btn btn-teal linkbtn" href="sms:&body=${txt}">💬 Tell Dad on iMessage</a>
    <button class="btn btn-main" onclick="closeSession(${n})">${n===3?'Finish! 🌟':'Done for now! 👋'}</button>`;
}
function closeSession(n){
  S.done[n]=true; checkBadges(); S.session=n+1; S.step=0; S.cur=null; S.qi=0; save(); go();
}

/* ============ retry code from Dad ============ */
function enterCode(){
  const c=prompt('Type the code Dad sent you:')||'';
  const m=c.trim().match(/^DD-([a-zA-Z0-9.]+)$/);
  if(!m){ alert('Hmm, that code doesn\'t look right. Ask Dad to check it!'); return; }
  const types=m[1].split('.').filter(t=>TYPES[t]);
  types.forEach(t=>S.retryQueue.push({type:t,reason:'parent'})); save();
  alert('Got it! '+types.length+' special questions from Dad added to your next Fix-it round. 🎁');
}

/* ============ parent corner ============ */
function renderParentGate(){
  if(!S.pin){
    render(`${header(0)}<div class="card"><h2>Parent corner … first visit</h2>
      <p>Create a 4 digit PIN so this area stays yours.</p>
      <input class="ans" id="p1" type="tel" maxlength="4" placeholder="Choose PIN">
      <input class="ans" id="p2" type="tel" maxlength="4" placeholder="Repeat PIN" style="margin-top:8px">
      <button class="btn btn-main" onclick="const a=$('#p1').value,b=$('#p2').value;
        if(a.length===4&&a===b){S.pin=a;save();renderParent('over');}else alert('PINs must match and be 4 digits.')">Save PIN</button>
      <button class="btn btn-ghost" onclick="go()">Back</button></div>`);
    return; }
  render(`${header(0)}<div class="card"><h2>Parent corner</h2>
    <input class="ans" id="pin" type="tel" maxlength="4" placeholder="Enter PIN">
    <button class="btn btn-main" onclick="if($('#pin').value===S.pin)renderParent('over');else alert('Wrong PIN')">Open</button>
    <button class="btn btn-ghost" onclick="go()">Back</button></div>`);
}
function pTabs(cur){
  const t=[['over','Overview'],['q','Questions'],['io','Import / Export'],['set','Settings']];
  return `<div class="rowflex" style="margin-bottom:10px">${t.map(x=>
    `<button class="tool ${x[0]===cur?'on':''}" onclick="renderParent('${x[0]}')">${x[1]}</button>`).join('')}
    <button class="tool" onclick="go()">← Exit</button></div>`;
}
function estBand(){
  if(S.mockScore!=null){ if(S.mockScore>=8)return '8–10 (strong)'; if(S.mockScore>=6)return '6–8 (on track)'; return '4–6 (needs targeted fixes)'; }
  const avg=Object.values(S.mastery).reduce((a,b)=>a+b,0)/8;
  return avg>=75?'7–9 (projected)':avg>=55?'5–7 (projected)':'3–6 (projected)'; }
function renderParent(tab){
  let body='';
  if(tab==='over'){
    const at=S.log; const ok=at.filter(a=>a.correct).length;
    const w=weakOrder();
    body=`<h2>Overview</h2>
     <p><b>${esc(S.name)||'Learner'}</b> · Sessions done: <b>${S.done.filter(Boolean).length}/4</b> ·
        Questions: <b>${at.length}</b> (${ok} correct) · Best streak: <b>${S.best}</b>
        ${S.mockScore!=null?` · Mock: <b>${S.mockScore}/${S.mockTotal}</b>`:''}</p>
     <p><b>Estimated exam Q8 band: ${estBand()}</b></p>
     ${masteryHTML()}
     <p class="small"><b>Focus next:</b> ${w.slice(0,2).map(s=>SKILLS[s].name).join(' · ')}</p>
     <p class="small"><b>Session summary for iMessage / Claude:</b></p>
     <textarea class="note" readonly>${esc(summaryText(Math.max(0,S.session-1)))}</textarea>
     <p class="small">For AI deep marking: send the downloaded session file from your iCloud folder to Claude together with the marking prompt (see the guide in your Revision System folder).</p>`;
  }
  else if(tab==='q'){
    const at=S.log.slice(-120).reverse();
    body=`<h2>Every question</h2><p class="small">Tap a row to review handwriting, override the mark, comment, or assign a similar question. ✎ = handwriting captured.</p>
     <table class="dash"><tr><th>S·Mode</th><th>Skill</th><th>Her answer</th><th>Mark</th></tr>
     ${at.map((a,i)=>{const ov=S.overrides[a.id];const ok=ov!=null?ov:a.correct;
       return `<tr onclick="renderPDetail(${S.log.indexOf(a)})" style="cursor:pointer">
        <td>${a.session+1}·${a.mode}</td><td>${SKILLS[a.skill].emoji} ${a.type}${a.png?' ✎':''}</td>
        <td>${esc(String(a.user).slice(0,14))}</td>
        <td><span class="pill ${ok?'g':'b'}">${ok?'✓':'✗'}${ov!=null?' *':''}</span></td></tr>`;}).join('')}</table>
     <p class="small">* = overridden by you</p>
     <h3>Assign extra practice</h3><p class="small">Send her a code by iMessage. She taps "🎁 code from Dad" and types it in.</p>
     <div class="rowflex">${Object.keys(SKILLS).map(s=>
       `<button class="tool" onclick="makeCode('${s}')">${SKILLS[s].emoji} ${SKILLS[s].name}</button>`).join('')}</div>
     <div id="codeOut"></div>`;
  }
  else if(tab==='io'){
    body=`<h2>Import / Export</h2>
     <p class="small"><b>Import</b> a session file from the iCloud folder (when reviewing on your own iPad):</p>
     <input type="file" id="impF" accept=".json">
     <button class="btn btn-soft" onclick="importFile()">Import session file</button>
     <p class="small" style="margin-top:14px"><b>Export</b> everything (full backup, also useful to send to Claude):</p>
     <button class="btn btn-soft" onclick="exportAll()">Download full backup</button>
     <div id="ioMsg"></div>`;
  }
  else{
    body=`<h2>Settings</h2>
     <p class="small">Learner name</p><input class="ans" id="setName" value="${esc(S.name)}">
     <p class="small">Change PIN</p><input class="ans" id="setPin" type="tel" maxlength="4" placeholder="New 4 digit PIN">
     <button class="btn btn-soft" onclick="const n=cleanName($('#setName').value);if(n)S.name=n;
       const p=$('#setPin').value; if(p.length===4)S.pin=p; save(); alert('Saved.')">Save</button>
     <button class="btn btn-ghost" onclick="if(confirm('Reset EVERYTHING? All progress will be lost.')){localStorage.removeItem('dd1');location.reload();}">⚠️ Reset the whole app</button>`;
  }
  render(`${header(0)}<div class="card">${pTabs(tab)}${body}</div>`);
}
function renderPDetail(i){
  const a=S.log[i]; if(!a){renderParent('q');return;}
  const ov=S.overrides[a.id]; const ok=ov!=null?ov:a.correct;
  render(`${header(0)}<div class="card">${pTabs('q')}
   <h2>Question review</h2>
   <p class="small">Session ${a.session+1} · ${a.mode} · ${SKILLS[a.skill].name} · ${a.timeS}s · hints used: ${a.hints} · source: ${TYPES[a.type]?'':''}${esc(a.type)}</p>
   <div class="qtext" style="font-size:18px">${a.prompt}</div>
   <p><b>Her answer:</b> ${esc(a.user)} &nbsp; <b>Expected:</b> ${esc(String(a.ans))} &nbsp;
      <span class="pill ${ok?'g':'b'}">${ok?'correct':'incorrect'}${ov!=null?' (overridden)':''}</span></p>
   ${a.png?`<p class="small">Her handwritten working:</p><img class="hw" src="${a.png}">`:'<p class="small">No handwriting captured for this one.</p>'}
   <div class="rowflex" style="margin-top:10px">
     <button class="tool" onclick="S.overrides['${a.id}']=true;save();renderPDetail(${i})">Override: correct ✓</button>
     <button class="tool" onclick="S.overrides['${a.id}']=false;save();renderPDetail(${i})">Override: incorrect ✗</button>
     <button class="tool" onclick="delete S.overrides['${a.id}'];save();renderPDetail(${i})">Clear override</button>
     <button class="tool" onclick="S.retryQueue.push({type:'${a.type}',reason:'parent'});save();alert('A similar question was added to her next Fix-it round.')">Assign similar ↻</button></div>
   <p class="small" style="margin-top:10px">Comment (she'll see this if you review together; also included in exports):</p>
   <textarea class="note" id="cmt">${esc(S.comments[a.id]||'')}</textarea>
   <button class="btn btn-soft" onclick="S.comments['${a.id}']=$('#cmt').value;save();alert('Comment saved.')">Save comment</button>
  </div>`);
}
function makeCode(skill){
  const ts=shuffle(SKILL_TYPES[skill].slice()).slice(0,3);
  $('#codeOut').innerHTML=`<div class="feedback fb-good">Send her this code: <b>DD-${ts.join('.')}</b><br>
    <a class="btn btn-teal linkbtn" style="margin-top:8px" href="sms:&body=${encodeURIComponent('Here is a bonus round for you! 🎁 Open Decimal Dash, tap "code from Dad" and type: DD-'+ts.join('.'))}">Send by iMessage</a></div>`;
}
function importFile(){
  const f=$('#impF').files[0]; if(!f){alert('Choose a file first.');return;}
  const r=new FileReader();
  r.onload=()=>{ try{
    const p=JSON.parse(r.result);
    if(p.app!=='DecimalDash')throw 0;
    const have=new Set(S.log.map(a=>a.id)); let n=0;
    for(const a of (p.attempts||[])){ if(!have.has(a.id)){S.log.push(a);n++;} }
    if(p.mastery)S.mastery=p.mastery;
    if(p.mockScore!=null)S.mockScore=p.mockScore;
    if(p.learner&&!S.name)S.name=cleanName(p.learner);
    save(); $('#ioMsg').innerHTML=`<div class="feedback fb-good">Imported ${n} new answers from ${esc(p.learner||'learner')}, session ${p.session}.</div>`;
   }catch(e){ $('#ioMsg').innerHTML=`<div class="feedback fb-bad">That file doesn't look like a Decimal Dash session.</div>`; } };
  r.readAsText(f);
}
function exportAll(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`DecimalDash_FullBackup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  $('#ioMsg').innerHTML=`<div class="feedback fb-good">Backup downloaded to your iCloud folder ✓</div>`;
}

/* ============ boot ============ */
go();
</script>
<script type="module" src="sync.js"></script>
</body>
</html>
